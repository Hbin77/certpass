Host aistream-jump
  HostName aiopen-ide-ssh.jntp-ax.or.kr
  Port 443
  User jump
  IdentityFile ~/.ssh/aistream_ed25519
  IdentitiesOnly yes
  ProxyCommand openssl s_client -quiet -connect %h:%p -servername aiopen-ide-ssh.jntp-ax.or.kr
  StrictHostKeyChecking accept-new
  UserKnownHostsFile ~/.ssh/aistream_known_hosts
  BatchMode yes
  ConnectTimeout 20

Host td-*
  ProxyJump aistream-jump
  User jovyan
  Port 2222
  IdentityFile ~/.ssh/aistream_ed25519
  IdentitiesOnly yes
  StrictHostKeyChecking no
  UserKnownHostsFile /dev/null
  BatchMode yes
  ConnectTimeout 20
