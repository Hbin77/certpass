    quote: "é aceita adequação por meio de etiqueta"
  - url: "https://ses.sp.bvs.br/wp-content/uploads/2022/09/U_RS-MS-ANVISA-RDC-752_190922.pdf"
    title: "U RS MS ANVISA RDC 752 190922"
    level: direct
    checked: 2026-11-07
    quote: "O registro tem validade por 10 (dez) anos"
  - url: "https://static.poder360.com.br/2025/07/dou-lei-15183-2025.pdf"
    title: "dou lei 15183 2025"
    level: direct
    checked: 2026-11-07
  - url: "local:조사자료_20261107/해외규격인증_일반583_화장품분류.csv"
    level: secondary
    checked: 2026-11-07
blocking_rules: []
conditional_rules:
  - "ANVISA 성분 목록(RDC 529·530·645·528·600·628, 메르코수르·EU 기반)은 통합표에 없음 — EU 기준으로 1차 선별만 [kw:ingredient_list_unavailable(MERCOSUR)]"
  - "EU 금지성분 포함 — ANVISA 목록 대조 필요 [kw:ingredient_banned(EU)]"
  - "EU 제한성분 한도 초과 [kw:ingredient_restricted_over(EU)]"
  - "배합 함량 미보유 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "브라질 AFE 보유 수입자 미지정 [kw:local_entity_missing(BR)]"
  - "안정성 자료 요약 없음 [kw:doc_missing(stability_summary)]"
  - "2025-07-31(Lei 15.183) 이후 동물시험 자료로는 판매 허가 불가 [kw:animal_test_data_present] [kw:date_on_or_after(2025-07-31)]"
notes: "원문 확인(2026-11-07, RDC 752/2022 관보 전문, Lei 15.183/2025 관보 지면): 등록은 제34조 9개군만, 그 외는 사전 통지 후 즉시 판매, 미백(Clareador da pele)·주름(Produto para rugas)은 2등급(효능 자료 요약), 수입 보유자는 AFE+지방 위생 허가, CFS 영사확인·아포스티유 불요(제10조), 포르투갈어 라벨·수입품 스티커 허용, 등록 10년, 2025-07-31 이후 동물시험 자료 사용 불가. 앞선 카드의 '미백·주름 = 별도 등록'은 '통지 + 효능 자료'로 고쳤다. 수수료는 Lei 9.782 원문(보고서 기준, URL 미기록). 미확인: 통지 수수료 실제 부과, RDC 530 하이드로퀴논 원문, 등록 처리기간."
