# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: AR_ANMAT
name_ko: 아르헨티나 화장품 등록(ANMAT)
name_en: Argentina ANMAT Cosmetic Product Registration / Notification
jurisdiction: AR
kind: mandatory_registration
strategic_kr: false
general_kr_no: 300
support_rate: "50~70%, 최대 1억(중기부 일반지원 583종 300번 ANMAT — 목록 설명은 의료기기이나 화장품도 관할)"
applies_to:
  product_types: [cosmetic]
  condition: "아르헨티나 수입·판매 화장품 [kw:target_market(AR)]"
ingredient_rules: AR   # 식약처 화장품 사용제한 원료정보 API(국가별 금지·한도)
claim_rules:
  - claim: whitening
    effect: needs_special_registration
    note: "효능 표방 제품은 2등급(등록) 가능성 (추정)"
  - claim: sunscreen
    effect: needs_special_registration
    note: "자외선차단은 2등급 (추정)"
  - claim: medical
    effect: not_allowed
    note: "치료 표현 불가 (추정)"
local_entity:
  required: true
  role: "ANMAT 허가 수입업체와 기술책임자 (추정)"
documents_required:
  - id: application
    desc: "ANMAT 신고·등록 신청 (추정)"
    satisfied_by_hint: []
    producer: company
  - id: formula_pct
    desc: "정성·정량 배합 (추정)"
    satisfied_by_hint: ["formula_known:full_with_concentration", "formula_composition_with_percent"]
    producer: manufacturer
  - id: CFS
    desc: "원산국 자유판매증명(아포스티유) (추정) — 국내 발급: 대한화장품협회 제조판매증명서(KR_CFS_EXPORT)"
    satisfied_by_hint: ["cfs_kcia*"]
    producer: authority
  - id: label_ar
    desc: "스페인어 라벨 (추정)"
    satisfied_by_hint: ["draft_from:label_kr"]
    producer: company
tests_required: [stability, microbiology]
labeling:
  language: "스페인어 (추정)"
  allergens: null
  other: ["알레르겐 — 확인 필요 (추정)", "수입자·기술책임자, 등록번호, 전성분, 로트·사용기한 (추정)"]
animal_testing: not_required
timeline:
  lead_time: "확인 필요 (추정)"
  fee: "확인 필요 (추정)"
  validity: "확인 필요 (추정)"
evidence:
  - url: "local:조사자료_20261107/해외규격인증_일반583_화장품분류.csv"
    level: secondary
    checked: 2026-11-07
  - url: "https://www.argentina.gob.ar/anmat"
    title: "ANMAT 기관 누리집"
    level: unverified
    checked: 2026-11-07
blocking_rules: []
conditional_rules:
  - "메르코수르 성분 목록은 통합표에 없음 [kw:ingredient_list_unavailable(MERCOSUR)]"
  - "EU 금지성분 포함 — 메르코수르 목록 대조 필요 [kw:ingredient_banned(EU)]"
  - "EU 제한성분 한도 초과 [kw:ingredient_restricted_over(EU)]"
  - "배합 함량 미보유 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "아르헨티나 수입업체 미지정 [kw:local_entity_missing(AR)]"
notes: "583종 분류(cos_note): 'ANMAT 화장품 등록(목록 설명은 일반)'. 등급·서류·기간·수수료는 전부 (추정)."
