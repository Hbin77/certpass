notes: "원문 확인(2026-11-07): NOM-141-SSA1/SCFI-2012(DOF) 5.1.6.1 멕시코 책임자 표시·수입품 통관 후 라벨 부착, 부록 A 미백 일반 명칭, Acuerdo(DOF 2007-03-21) 하이드로퀴논 인조손톱 0.02%·레티놀 0.15%, 일반보건법 제271조의2(2021-10-14, 법령 미러) 동물시험 화장품 금지. 알부틴·나이아신아마이드·리모넨은 Acuerdo 미등재, 향료 알레르겐 표기 의무 없음 — allergens는 비워 둠. 2차: 사전 등록 없음·수입업체 영업신고, 기술 서류 보유 권장. 미확인: 위생규칙(RCSPS) 원문, 2007 이후 Acuerdo 개정, 통관 때 NOM-141 적합 증명 요구 여부."
