blocking_rules:
  - "동물성 원료 포함(꿀·밀랍·라놀린·쉘락·실크·로열젤리·동물성 색소·진주 등, 가공보조제·배양배지 포함) [kw:ingredient_animal_derived]"
conditional_rules:
  - "기원 확인이 필요한 원료 [kw:ingredient_origin_unknown(animal)]"
  - "비의도적 혼입 0.1%(1g/kg) 초과 — 공정 개선 의무(자동 탈락은 아님) [kw:manual_check(V_LABEL_traces)]"
  - "화장품 동물실험 기준의 현행 위치 확인 — V02.02의 동물실험 금지·GMO 표시 제품 불가 조항이 V02.03에서 삭제됨 [kw:manual_check(V_LABEL_animal_testing)]"
notes: "원문 확인(2026-11-07, V-Label Criteria V02.03(2026-09-04)·V02.02(2025-01-20) 비교, FAQ): 동물은 모든 척추·무척추동물(해조류는 제외), 생산·가공 전 단계 동물 유래 원료·가공보조제·배양배지 금지, 비의도적 혼입 0.1% 기준, 라이선서 위탁 정기 감사, 연 라이선스비+1회 검사비(비공개), 2~8주, 계약 1년 자동 연장. V02.02에 있던 동물실험 금지·GMO 표시 제품 불가 조항이 V02.03에서 빠져, 앞선 카드의 동물실험 서류·규칙을 '현행 위치 확인'으로 바꿨다(animal_testing은 보수적으로 banned 유지). 엔진은 id(V_LABEL)로 성분 vegan 속성 검사. 미확인: 화장품 동물실험 기준의 현행 위치, SGS 화장품 브로슈어(403), 요율."
