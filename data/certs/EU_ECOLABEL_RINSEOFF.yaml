# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: EU_ECOLABEL_RINSEOFF
name_ko: EU 에코라벨(화장품 — 씻어내는·바르는 제품)
name_en: EU Ecolabel — Cosmetic Products (Decision (EU) 2021/1870, rinse-off and leave-on)
jurisdiction: EU
kind: voluntary_certification
strategic_kr: false
general_kr_no: 118
support_rate: "50~70%, 최대 1억(중기부 일반지원 583종 118번 Eco-Labeling)"
applies_to:
  product_types: [cosmetic]
  condition: "화장품 전체 — 결정 (EU) 2021/1870 제1조 'shall include rinse-off and leave-on products' (이전 결정 2014/893은 씻어내는 제품만)"
excluded_basis: "EU 에코라벨 결정 (EU) 2021/1870 부속서 I 기준 4(b) — 농도와 상관없이 처방·혼합물·불순물로도 불가"
excluded_ingredients: [BHT, BHA, Cocamide DEA, Deltamethrin, Pentetic Acid, Pentasodium Pentetate, EDTA, Disodium EDTA, Tetrasodium EDTA, Trisodium EDTA, Dipotassium EDTA, Calcium Disodium EDTA, "Nonoxynol-*", "Octoxynol-*", Resorcinol, Sodium Hypochlorite, Sodium Chlorite, Chloramine T, Sodium Phosphate, Disodium Phosphate, Trisodium Phosphate, Benzyl Salicylate, Butylphenyl Methylpropional, Tetramethyl Acetyloctahydronaphthalenes, Daidzein, Genistein, Benzalkonium Chloride, DMDM Hydantoin, Imidazolidinyl Urea, Diazolidinyl Urea, Quaternium-15, Sodium Hydroxymethylglycinate, "2-Bromo-2-Nitropropane-1,3-Diol", Methylisothiazolinone, Methylchloroisothiazolinone, Benzisothiazolinone, Kojic Acid, "*paraben", Triclocarban, Triclosan, Benzophenone, "Benzophenone-1", "Benzophenone-2", "Benzophenone-3", "Benzophenone-4", "Benzophenone-5", Ethylhexyl Methoxycinnamate, Homosalate, Octocrylene, Triphenyl Phosphate, "*phthalate", "Perfluoro*", Polytetrafluoroethylene, Musk Ketone, Musk Xylene]
excluded_check:
  - {pattern: "glycine max*", message: "콩 원료 — 배제 이소플라본(다이드제인·제니스테인) 포함 여부 확인(기준 4(b) xix)"}
  - {pattern: "*nano*", message: "나노물질 — 부속서 III·IV·VI 나노 조건 안에서만 허용(기준 4(b) ix)"}
  - {pattern: "synthetic wax*", message: "합성 왁스 — 미세플라스틱(불용성 합성 고분자 입자) 해당 여부 확인(기준 4(b) vii)"}
  - {pattern: "*polyethylene*", message: "폴리에틸렌 — 미세플라스틱 해당 여부 확인(기준 4(b) vii)"}
