notes: "583종 분류(cos_note): 'EU Ecolabel — 씻어내는 화장품(rinse-off) 기준 존재 → 클렌징밤·폼 해당'. 기준 결정 번호(2021/1870로 추정)·적용 범위·배제 물질·수수료·유효기간은 전부 (추정). 신청은 출시 회원국 관할기관 (추정). 583종 138번 Nordic Swan도 화장품 기준 보유 — 카드 미작성."
