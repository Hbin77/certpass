# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: SA_SFDA
name_ko: 사우디 화장품 신고(SFDA eCosma)
name_en: Saudi FDA Cosmetic Product Notification (eCosma)
jurisdiction: SA
kind: mandatory_registration
strategic_kr: false
general_kr_no: 288
support_rate: "50~70%, 최대 1억(중기부 일반지원 583종 288번 SFDA)"
applies_to:
  product_types: [cosmetic]
  condition: "사우디 수입·유통 화장품 전부 — eCosma 등재 전 수입·거래 불가(화장품법 6조). 호텔·병원 직접 공급분, 소매상 자가 매장 직수입은 면제 [kw:target_market(SA)]"
ingredient_rules: EU
claim_rules:
  - claim: whitening
    effect: ok
    note: "화장품 범위 표방 가능 — 표방이 화장품 여부 판단 기준이므로 SFDA 제품 분류 지침 확인 (추정)"
  - claim: acne
    effect: drug_risk
    note: "치료 표현이면 의약품 분류 (추정)"
  - claim: medical
    effect: not_allowed
    note: "표방(포장·광고 포함)이 화장품 해당 여부를 가름 — 치료 표현 불가"
local_entity:
  required: true
  role: "사우디 상업등록을 가진 현지 업체(수입자)가 eCosma 계정·신고, 해외 업체는 위임장(현지 공증·상공회의소 확인)"
documents_required:
  - id: account_docs
    desc: "eCosma 계정: 현지 업체 상업등록 사본, 소유자 신분증·설립계약서, 외국·합작 회사는 투자 허가, 담당자 신분증·위임장"
    satisfied_by_hint: ["company.local_entities:SA"]
    producer: company
  - id: authorization_letter
    desc: "위임장: 위임·피위임 업체 이름·주소·상업등록번호, 위임 업체 공식 용지·직인, 서명, 관할 기관 확인"
    satisfied_by_hint: []
    producer: company
  - id: label_images
    desc: "제품 전면·전 측면 라벨 이미지(내·외부 라벨과 설명서), PNG·JPG·TIFF·PDF. GSO 1943 및 SFDA 기술규정 적합, 자체 바코드"
    satisfied_by_hint: ["draft_from:label_kr", "draft_from:packaging_spec_*"]
    producer: company
  - id: ingredients_exact
    desc: "전 성분(유효·비유효)과 역할, 정확한 농도 입력. DB에 없는 성분은 INCI·CAS로 추가 요청(eCosma@sfda.gov.sa)"
    satisfied_by_hint: ["formula_known:full_with_concentration", "formula_composition_with_percent"]
    producer: manufacturer
  - id: PIF
    desc: "제품정보파일(SFDA.CO 6000:2020) 보관, 요청 시 제출"
    satisfied_by_hint: []
    producer: company
  - id: conformity_analysis
    desc: "요청 시 규격 적합 분석 결과 제출"
    satisfied_by_hint: ["finished_product_test_report", "test_report_*"]
    producer: lab
tests_required: [microbiology, heavy_metals, stability]
labeling:
  language: "아랍어(또는 아랍어·영어 병기) (추정)"
  allergens: null
  other: ["알레르겐 — GSO 1943 기준 — 확인 필요 (추정)", "제품 자체 바코드(크기·색상별)", "GSO 1943 라벨 항목 (추정)", "표방 문구는 포장·포스터·광고 전체가 판단 대상"]
animal_testing: not_required
timeline:
  lead_time: "eCosma 온라인 심사 — 기간 확인 필요 (추정)"
  fee: "신고 수수료 — 금액 확인 필요 (추정)"
  validity: "만료 최소 90일 전 갱신(화장품법 6조). 유효기간 자체는 1년으로 추정 (추정)"
evidence:
  - url: "local:조사자료_20261107/규제원문_dl_sa/notif.pdf"
    level: direct
    checked: 2026-11-07
  - url: "local:조사자료_20261107/규제원문_dl_sa/notif.txt"
    level: direct
    checked: 2026-11-07
  - url: "https://www.sfda.gov.sa"
    title: "기관 누리집"
    level: direct
    checked: 2026-11-07
blocking_rules: []
conditional_rules:
  - "GSO 1943 성분 부속서는 유료 표준이라 통합표에 없음 — EU 기준으로 1차 선별만 [kw:ingredient_list_unavailable(GSO1943)]"
  - "EU 금지성분 포함 — GSO 1943·SFDA 금지목록 대조 필요 [kw:ingredient_banned(EU)]"
  - "EU 제한성분 한도 초과 [kw:ingredient_restricted_over(EU)]"
  - "정확 농도 미보유 — eCosma 입력 불가 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "사우디 현지 신고 업체 미지정 [kw:local_entity_missing(SA)]"
  - "제품 자체 바코드 없음 [kw:doc_missing(label_images)]"
  - "eCosma DB에 없는 성분 — INCI·CAS로 추가 요청 필요 [kw:ingredient_match_unresolved]"
notes: "원문 확인(SFDA 신고 지침 Vol.2 ◎): eCosma 신고는 SFDA의 안전성 평가가 아님(신고자 책임), 라벨 이미지·바코드·성분 역할·정확 농도, 계정 서류, 위임장 요건, 면제 대상, 신고자 책임(PIF SFDA.CO 6000:2020, 해외 리콜 보고 등), 변경 시 갱신 vs 신규 신고 표(상표명·제품명·제조사·생산회사·수입자·성분 변경은 신규), 만료 90일 전 갱신. GSO 1943 원문은 유료로 미확인 — 성분 규칙은 전부 conditional. 아랍어 라벨·수수료·유효기간은 (추정)."
