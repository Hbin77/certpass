# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: MM_FDA
name_ko: 미얀마 화장품 등록(Myanmar FDA)
name_en: Myanmar FDA Cosmetic Notification/Registration
jurisdiction: MM
kind: mandatory_registration
strategic_kr: false
general_kr_no: 438
support_rate: "50~70%, 최대 1억(중기부 일반지원 583종 438번 미얀마FDA)"
applies_to:
  product_types: [cosmetic]
  condition: "미얀마 수입·판매 화장품 — ACD 기반 사전 노티피케이션(e-Submission dut.fda.gov.mm), 이후 상무부 TradeNet 2.0 수입허가(3개월) 필요(2차) [kw:target_market(MM)]"
ingredient_rules: ASEAN
claim_rules:
  - claim: whitening
    effect: drug_risk
    note: "미백 제품 자체는 ACD상 화장품 범위, 멜라닌 생성 억제·색소 치료 표현은 불가(ACD 표방 지침) — 외관 표현으로 바꿔야 함"
  - claim: anti_wrinkle
    effect: drug_risk
    note: "ACD 표방 지침상 '노화로 인한 생리적 변화를 예방·감소·역전' 표현 불가 — 주름 외관 개선 표현으로 바꿔야 함"
  - claim: medical
    effect: not_allowed
    note: "의약 효능 표현 금지(2차)"
local_entity:
  required: true
  role: "미얀마 등록 회사(수입자) + 제조사 위임장(LOA) — 외국 제조사 직접 신고 불가(2차)"
documents_required:
  - id: application
    desc: "FDA e-Submission 노티피케이션 신청 — 이후 TradeNet 2.0 수입허가(2차)"
    satisfied_by_hint: []
    producer: company
  - id: LoA
    desc: "제조사 위임장(LOA)과 현지 회사 등록증(2차)"
    satisfied_by_hint: []
    producer: company
  - id: CFS_GMP
    desc: "원산국 승인 또는 자유판매증명(CFS)·제조사 GMP 증명(2차) — 국내 발급: 대한화장품협회 제조판매증명서(KR_CFS_EXPORT). 영사확인 요건 미확인"
    satisfied_by_hint: ["cfs_kcia*", "manufacturer.certs:ISO 22716", "manufacturer.certs:CGMP"]
    producer: authority
  - id: formula_pct
    desc: "전성분·함량(%)(2차)"
    satisfied_by_hint: ["formula_known:full_with_concentration", "formula_composition_with_percent"]
    producer: manufacturer
  - id: PIF
    desc: "PIF 보관 — 서명 안전성 평가, 2024-12부터 아트워크 포함(2차). 현재 안전성 평가서(CPSR) 미보유"
    satisfied_by_hint: []
    producer: external_expert
  - id: label_mm
    desc: "라벨 아트워크 — 영어 및/또는 미얀마어(자료 상충, 2차)"
    satisfied_by_hint: ["draft_from:label_kr"]
    producer: company
tests_required: [microbiology, heavy_metals]
labeling:
  language: "영어 및/또는 미얀마어(JETRO) — 미얀마어 필수라는 자료(OMC)와 상충, 2차"
  allergens: null
  other: ["향료 알레르겐 개별 표시 의무 없음 — 미얀마가 따르는 ACD 부속서 III에 해당 항목 없음(ACD 원문, 미얀마의 ACD 적용은 2차)", "ACD 공통 라벨 항목 (추정)"]
animal_testing: not_required
timeline:
  lead_time: "4~8주(KCIA 2023, 2차)"
  fee: "제품당 500,000 MMK(KCIA 2023, 2차)"
  validity: "2년, 만료 1개월 전 갱신(2차)"
evidence:
  - url: "https://file.go.gov.sg/annexes-of-the-asean-cosmetic-directive.pdf"
    title: "아세안 화장품 지침 ACD 부속서"
    level: direct
    checked: 2026-11-07
    quote: "Version No.: 2026-1, 22nd June 2026"
  - url: "https://file.go.gov.sg/appendix-iii-asean-cosmetic-claims-guidelines.pdf"
    title: "appendix iii asean cosmetic claims guidelines"
    level: direct
    checked: 2026-11-07
    quote: "Prevents, reduces or reverses the physiological changes and degeneration conditions brought about by aging"
  - url: "local:조사자료_20261107/해외규격인증_일반583_화장품분류.csv"
    level: secondary
    checked: 2026-11-07
  - url: "https://www.fda.gov.mm"
    title: "기관 누리집"
    level: unverified
    checked: 2026-11-07
blocking_rules:
  - "ASEAN 금지성분 포함(EU 준용 대조) [kw:ingredient_banned(ASEAN)]"
  - "ASEAN 제한성분 한도 초과 [kw:ingredient_restricted_over(ASEAN)]"
conditional_rules:
  - "ASEAN 값은 EU 행 대용(미얀마 적용 판본은 ACD 2023 릴리스, 2차) [kw:ingredient_list_unavailable(ASEAN_ACD)]"
  - "제한성분 함량 미상 [kw:ingredient_restricted_conc_unknown(ASEAN)]"
  - "미얀마 등록 수입사 미지정 [kw:local_entity_missing(MM)]"
  - "CFS·GMP 증명 미준비 [kw:doc_missing(CFS_GMP)]"
  - "PIF 안전성 평가 없음 [kw:doc_missing(PIF)]"
  - "라벨 언어 — 미얀마어 필수 여부 확인 [kw:manual_check(MM_label_language)]"
  - "정세·송금 등 실무 제약 확인 (추정) [kw:manual_check(MM_market_access)]"
notes: "국가 절차는 2차 자료(JETRO 2025-12, KCIA 2023, ChemLinked)로만 확인 — fda.gov.mm은 TLS 오류, 가이드라인 404로 원문을 열지 못함. 원문은 ACD 문서(성분·표방·알레르겐 표시 의무 없음)뿐이라 allergens를 비움. 2025-11 미등록·금지성분 적발 공표(2차). 미확인: FDA 원문 가이드라인·공식 수수료, 미얀마어 라벨 의무, CFS 영사확인."
