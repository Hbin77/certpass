blocking_rules:
  - "D4(Cyclotetrasiloxane, CAS 556-67-2) 포함 — 화장품 부속서 II 금지(ref 1388, Reg. 2019/831) [kw:ingredient_present(Cyclotetrasiloxane|556-67-2)]"
  - "씻어내는 제품에 D5 0.1% 이상(2020-01-31 이후) [kw:application(rinse_off)] [kw:ingredient_conc_over(Cyclopentasiloxane|541-02-6,0.1)]"
  - "2027-06-06 이후 바르는 제품의 D5·D6, 씻어내는 제품의 D6 0.1% 이상 [kw:date_after(2027-06-06)] [kw:ingredient_conc_over(Cyclopentasiloxane|541-02-6|Cyclohexasiloxane|540-97-6,0.1)]"
conditional_rules:
  - "사이클로메티콘(D4·D5·D6 혼합) 표기 — 구성비 확인 필요(통합표는 D4 금지 행에 연결) [kw:ingredient_present(Cyclomethicone)]"
  - "D5·D6 사용인데 함량 미상 [kw:ingredient_present(Cyclopentasiloxane|541-02-6|Cyclohexasiloxane|540-97-6)] [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "바르는 제품의 D5·D6, 씻어내는 제품의 D6 사용(2027-06-06까지) — 재처방 일정 필요 [kw:ingredient_present(Cyclopentasiloxane|541-02-6|Cyclohexasiloxane|540-97-6)]"
  - "실리콘 원료(디메치콘 등) 사용 — D4·D5·D6 잔류 0.1% 미만 공급사 선언(또는 잔류 시험) 필요 [kw:ingredient_present(*Dimethicone*|*Methicone*|*Siloxane*)]"
notes: "원문 확인(CosIng 부속서 II CSV ◎): D4는 ref 1388로 화장품 금지(Reg. 2019/831, CMR 생식독성 2, 식별 성분 CYCLOMETHICONE) — D5·D6은 화장품 부속서에 없음. 성분 물질을 연 1톤 이상 EU로 들여오면 EU 수입자가 REACH 등록(583종 비고). REACH 부속서 XVII 70항은 EUR-Lex 원문(Reg. 2024/1328)과 대조함(2026-11-07): 1항 일반 금지 2026-06-06 이후, 3(a) 씻어내는 화장품의 D4·D5는 2020-01-31 이후(Reg. 2018/35에서 이어짐), 3(b) 그 밖의 모든 화장품은 2027-06-06 이후, 기준 0.1%. 씻어내는 제품의 D6도 3(b)에 속해 2027-06-06 이후 금지. 같은 REACH 부속서 XVII의 미세플라스틱 제한(2023/2055)도 씻어내는 제품에 걸릴 수 있음 — 별도 카드 필요 (추정). 583종 182번 UK REACH도 같은 구조 (추정)."
