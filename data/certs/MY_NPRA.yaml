    checked: 2026-11-07
blocking_rules:
  - "ASEAN 금지성분 포함(EU 부속서 II 준용 대조 — 하이드로퀴논·수은·디옥시아르부틴 등) [kw:ingredient_banned(ASEAN)]"
  - "ASEAN 제한성분 한도 초과 [kw:ingredient_restricted_over(ASEAN)]"
  - "보존제·UV필터·색소가 ACD 허용목록 밖 [kw:ingredient_positive_list_missing(ASEAN)]"
conditional_rules:
  - "ASEAN 값은 EU 행 대용 — ACD 부속서 2026-1판과 차이 확인(EU 2024/996 알부틴·알파알부틴 제한은 ACD에 없음) [kw:ingredient_list_unavailable(ASEAN_ACD)]"
  - "제한성분 함량 미상 [kw:ingredient_restricted_conc_unknown(ASEAN)]"
  - "배합 함량 미보유 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "말레이시아 CNH 미지정 [kw:local_entity_missing(MY)]"
  - "PIF의 서명 안전성 평가서·평가자 CV 없음 [kw:doc_missing(PIF)]"
  - "제조사 GMP 증빙 없음(요청 시 제시) [kw:manufacturer_cert_missing(ISO 22716|CGMP)]"
  - "한국 기능성 미백·주름 문구를 그대로 번역해 사용 [kw:claim(whitening|anti_wrinkle)]"
notes: "원문 확인(2026-11-07, NPRA 지침·Annex I part 8·12·13, HSA 게시 ACD 부속서 2026-1판·표방 지침·라벨 요건): CNH는 말레이시아 설립 법인, 신고 때 제출 서류 없음(CFS 불필요, GMP 증빙은 요청 시), PIF에 서명 안전성 평가서·평가자 CV, 제품당 RM50·유효 2년, 할랄 로고는 자발. 아세안은 EU식 향료 알레르겐 표시 의무가 없어 allergens를 비움(엔진이 향료 알레르겐 구성 확인을 요구하지 않음). 미확인: 라벨 Annex I part 7 원문(404)과 스티커 허용, QUEST 신고 때 LoA 업로드 여부, 미백 제품 COA 1개월 내 제출(구 FAQ)의 현행 적용 여부."
