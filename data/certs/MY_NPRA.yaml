    quote: "The notification of a cosmetic product shall be valid for 2 years."
  - url: "https://www.npra.gov.my/images/Guidelines_Central/Guidelines_on_Cosmetic/Annex_I_part_13-GUIDELINE_FOR_PRODUCT_INFORMATION_FILE_PIF.pdf"
