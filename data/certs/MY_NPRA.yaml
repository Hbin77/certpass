# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: MY_NPRA
name_ko: 말레이시아 화장품 노티피케이션(NPRA)
name_en: Malaysia NPRA Cosmetic Product Notification (ASEAN Cosmetic Directive)
jurisdiction: MY
kind: mandatory_registration
strategic_kr: false
general_kr_no: 261
support_rate: "50~70%, 최대 1억(중기부 일반지원 583종 261번 NPRA)"
applies_to:
  product_types: [cosmetic]
  condition: "말레이시아 수입·판매 화장품 전부(출시 전 노티피케이션, NPRA QUEST 3+ 온라인) [kw:target_market(MY)]"
ingredient_rules: ASEAN
claim_rules:
  - claim: whitening
    effect: drug_risk
    note: "미백 제품 자체는 화장품 범위지만 말레이시아 표방 지침은 'inhibition of melanin synthesis'(멜라닌 합성 억제)와 색소·기미 치료 표현을 불가로 둠 — 한국 기능성 미백 문구는 '피부 톤이 밝아 보이게' 같은 외관 표현으로 바꿔야 함. 하이드로퀴논은 ACD 부속서 II 금지(인조손톱 전문가용 0.02% 제외), 알부틴·나이아신아마이드는 ACD 목록에 없어 사용 가능"
  - claim: anti_wrinkle
    effect: drug_risk
    note: "'Prevent/ reduce ... wrinkle' 같은 외관 표현은 허용, ACD 표방 지침의 '노화로 인한 생리적 변화를 예방·감소·역전' 표현은 불가 — 한국 '주름 개선' 기능성 문구는 외관 표현으로 바꿔야 함"
  - claim: sunscreen
    effect: ok
    note: "ASEAN에서는 화장품, UV필터는 ACD 부속서 VII (추정)"
  - claim: acne
    effect: drug_risk
    note: "'여드름성 피부용'은 가능, 치료 표현은 의약품 (추정)"
  - claim: hair_loss
    effect: drug_risk
    note: "발모·탈모 치료 표현은 의약품 (추정)"
  - claim: medical
    effect: not_allowed
    note: "질병 치료·예방 표현은 ACD 표방 지침상 화장품에 쓸 수 없음"
  - claim: halal
    effect: ok
    note: "화장품 할랄 로고는 자발 사용(NPRA 지침 3.4). 수입품 할랄 표시는 JAKIM 또는 JAKIM 공인 해외기관(KMF·KHA) 인증 필요 → HALAL"
local_entity:
  required: true
  role: "말레이시아 설립 법인(SSM 등록, 화장품 사업)인 제품 노티피케이션 보유자(CNH) — 외국 기업 직접 신고 불가, CNH가 제품 소유자가 아니면 위임장(LoA) 필요. CNH가 PIF 보관·제조사 GMP 보증 책임"
documents_required:
  - id: notification
    desc: "NPRA QUEST 3+ 온라인 노티피케이션(제조사·전성분·라벨 입력 — 신고 때 따로 내는 서류는 없음, CFS 불필요)"
    satisfied_by_hint: []
    producer: company
  - id: LoA
    desc: "브랜드 소유자가 현지 CNH에 준 위임장(CNH가 제품 소유자가 아닐 때)"
    satisfied_by_hint: []
    producer: company
  - id: PIF
    desc: "ASEAN 제품정보파일(PIF) — 서명된 인체 안전성 평가서와 평가자 이력서(CV) 포함, 현지 CNH 보관(사후 점검 대상). 현재 안전성 평가서(CPSR) 미보유"
    satisfied_by_hint: []
    producer: external_expert
  - id: formula_pct
    desc: "전성분과 제한성분 함량(QUEST 입력·PIF용)"
    satisfied_by_hint: ["formula_known:full_with_concentration", "formula_composition_with_percent"]
    producer: manufacturer
  - id: GMP_proof
    desc: "제조사 GMP 증빙 — NPRA 요청 시 제시, ISO 22716 동등 인정(원산국 공인기관 발행·배서 조건)"
    satisfied_by_hint: ["manufacturer.certs:ISO 22716", "manufacturer.certs:CGMP"]
    producer: manufacturer
  - id: label_my
    desc: "영어 및/또는 말레이어 라벨(현지 CNH 이름·주소 포함)"
    satisfied_by_hint: ["draft_from:label_kr", "draft_from:leaflet_*"]
    producer: company
tests_required: [stability, microbiology, heavy_metals]
labeling:
  language: "영어 및/또는 말레이어(ACD 라벨 요건)"
  allergens: null
  other: ["향료 알레르겐 개별 표시 의무 없음 — ACD 부속서 III(2026-1판)에 해당 항목이 없고, 향료는 'perfume'·'fragrance'로 묶어 표기 가능", "ACD 라벨 항목: 제품명·기능, 사용법, 전성분(INCI, 1% 초과 내림차순), 제조국, 현지 책임 회사 이름·주소, 내용량, 배치번호, 제조일 또는 사용기한(30개월 미만 제품은 사용기한), 주의사항", "스티커 라벨 허용 여부 — 말레이시아 개별 규정(Annex I part 7) 미확인"]
animal_testing: not_required
timeline:
  lead_time: "결제 확인 후 1~3일 발급(NPRA FAQ)"
  fee: "제품(변형)당 RM50, QUEST 계정 RM260~290(2년)"
  validity: "2년, 만료 1개월 전 갱신(RM50)"
evidence:
  - url: "https://www.npra.gov.my/images/Guidelines_Central/Guidelines_on_Cosmetic/GUIDELINES_FOR_CONTROL_OF_COSMETIC_PRODUCTS_IN_MALAYSIA.pdf"
    title: "GUIDELINES FOR CONTROL OF COSMETIC PRODUCTS IN MALAYSIA"
