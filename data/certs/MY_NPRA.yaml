    quote: "The CNH must be a locally incorporated company or legal entity in the field of cosmetics"
  - url: "https://www.npra.gov.my/images/Guidelines_Central/Guidelines_on_Cosmetic/GUIDELINES_FOR_CONTROL_OF_COSMETIC_PRODUCTS_IN_MALAYSIA.pdf"
    title: "GUIDELINES FOR CONTROL OF COSMETIC PRODUCTS IN MALAYSIA"
    level: direct
    checked: 2026-11-07
    quote: "The processing fee for notification of a cosmetic product is RM50.00 for each product"
  - url: "https://www.npra.gov.my/images/Guidelines_Central/Guidelines_on_Cosmetic/GUIDELINES_FOR_CONTROL_OF_COSMETIC_PRODUCTS_IN_MALAYSIA.pdf"
    title: "GUIDELINES FOR CONTROL OF COSMETIC PRODUCTS IN MALAYSIA"
    level: direct
