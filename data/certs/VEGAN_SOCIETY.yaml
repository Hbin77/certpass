    satisfied_by_hint: []
    producer: company
  - id: ingredient_origin
    desc: "전성분과 원료별 비동물성 선언(공급사) — 동물 유래 원료·부산물·파생물 전무"
    satisfied_by_hint: ["draft_from:formula_*", "draft_from:ingredient_list_*"]
    producer: manufacturer
  - id: no_animal_testing
    desc: "제품·원료 동물실험 미실시 선언 — 효능·독성·안전성 시험과 모든 관할의 법정 동물실험 포함, 신청자·대리인·실효적 지배 주체가 한 시험 전부"
    satisfied_by_hint: []
    producer: company
  - id: cross_contamination
    desc: "교차오염 관리 — 동물 유래 오염 최대 100ppm, 비건 생산 전 설비 세척, 직원 교육"
    satisfied_by_hint: []
    producer: manufacturer
  - id: packaging_materials
    desc: "포장재에 동물 유래 소재(밀랍·가죽·젤라틴 접착제) 미사용 확인 — 사용하면 인증 불가"
    satisfied_by_hint: ["packaging_spec_*"]
