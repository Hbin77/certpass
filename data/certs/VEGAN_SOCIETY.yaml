blocking_rules:
  - "동물성 원료 포함(무척추동물 포함 — 진주·밀랍·카민·실크·라놀린 등) [kw:ingredient_animal_derived]"
  - "완제품·원료 동물실험 실시(수출국 법정 시험 포함) [kw:animal_test_data_present]"
  - "중국 특수화장품 注册(독성시험 필수) 대상으로 중국 출시 — 법정 동물실험도 불인정 (중국 특수 포기 시 재판정) [kw:target_market(CN)] [kw:card_verdict(CN_NMPA_SPECIAL,조건부|통과 가능)]"
conditional_rules:
  - "기원 확인이 필요한 원료 [kw:ingredient_origin_unknown(animal)]"
  - "중국 일반화장품 수출 — 독성시험 면제(정부 GMP+안전평가) 경로·시판 후 검사 가능성 확인 (추정) [kw:target_market(CN)]"
  - "동물실험 미실시 선언 미준비 [kw:doc_missing(no_animal_testing)]"
  - "포장재 동물 유래 소재 확인 안 됨 [kw:doc_missing(packaging_materials)]"
notes: "원문 확인(2026-11-07, Vegan Trademark Standards PDF): '동물'은 동물계 전체(척추동물+다세포 무척추동물), 동물 유래 원료·부산물·파생물 전무, 동물실험 금지(효능·독성·안전성·화장품 평가, 모든 관할 법정 시험 포함, 신청자·대리인·실효적 지배 주체 — 공급사의 독립 시험은 명시 범위 밖), 동물 유전자·동물 유래 물질을 쓰지 않은 GMO 허용, 교차오염 100ppm, 밀랍·젤라틴 접착제 포장은 인증 불가, 12/24개월. 30~60 업무일(문서 §4-6 ◎). 엔진은 id(VEGAN)로 성분 vegan 속성 검사. 미확인: 공식 신청 단계·필수 서류 목록, 로고 사용 지침, 비용(견적)."
