blocking_rules:
  - "ASEAN 금지성분 포함(EU 준용 대조 — 하이드로퀴논·수은 등) [kw:ingredient_banned(ASEAN)]"
  - "ASEAN 제한성분 한도 초과 [kw:ingredient_restricted_over(ASEAN)]"
  - "보존제·UV필터·색소가 허용목록 밖 [kw:ingredient_positive_list_missing(ASEAN)]"
conditional_rules:
  - "2028-10-17 이후 출시 — BPJPH 할랄 인증 미확보면 인증 취득 또는 비할랄 표시 [kw:date_on_or_after(2028-10-17)] [kw:card_verdict(HALAL,불가|조건부)]"
  - "ASEAN 값은 EU 행 대용 — PerBPOM 25/2025(ACD 준용)와 차이 확인 [kw:ingredient_list_unavailable(ID_BPOM_INGREDIENTS)]"
  - "제한성분 함량 미상 [kw:ingredient_restricted_conc_unknown(ASEAN)]"
  - "배합 함량 미보유 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "현지 수입자 미지정 [kw:local_entity_missing(ID)]"
  - "CFS 미준비 [kw:doc_missing(CFS)]"
  - "정부 발행 GMP 인증서 없음(식약처 CGMP 미보유 제조사) [kw:manufacturer_cert_missing(CGMP)]"
  - "DIP(PIF)·안전성 평가서 없음 [kw:doc_missing(PIF)]"
notes: "원문 확인(2026-11-07): PerBPOM 20/2026(2026-10-23, 신청인·추천서·제20조 서류·14영업일·유효 3년), PerBPOM 25/2025(ACD 준용), PerBPOM 18/2024(라벨 언어·2D 바코드·광고), BPJPH 공지(PP 40/2026, 2026-10-14 — 화장품 할랄 의무 2026-10-17 → 2028-10-17 연장). 앞선 카드의 '2026-10-17 할랄 의무(PP 42/2024)'는 PP 40/2026으로 바뀌어 할랄 인증서를 필수 서류에서 뺐다. 2028-10-17 이후 할랄 판정은 날짜 조건이라 엔진이 아직 평가하지 못함(conditional_rules만 기록). 2차: 수수료 Rp1,500,000(CIRS 요약), 비할랄 표시(BPJPH 3/2026 법령 미러). 미확인: 20/2026의 CFS·GMP 아포스티유·영사확인 요건, PP 15/2026 실제 요율, PerBPOM 3/2022 'memutihkan' 허용 여부, 스티커 라벨 명문, 민간 ISO 22716 수용 여부."
