# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: ID_BPOM
name_ko: 인도네시아 화장품 노티피카시(BPOM)
name_en: Indonesia BPOM Cosmetic Notification (Notifikasi Kosmetika)
jurisdiction: ID
kind: mandatory_registration
strategic_kr: false
general_kr_no: 317
support_rate: "50~70%, 최대 1억(중기부 일반지원 583종 317번 BPOM)"
applies_to:
  product_types: [cosmetic]
  condition: "인도네시아 수입·유통 화장품 전부(출시 전 노티피카시, Notifkos 3.0, PerBPOM 20/2026). 화장품 할랄 의무는 PP 40/2026으로 2028-10-17까지 유예 — 판정일 기준 자발 [kw:target_market(ID)]"
ingredient_rules: ASEAN
claim_rules:
  - claim: whitening
    effect: drug_risk
    note: "미백 제품 자체는 ACD상 화장품 범위, 멜라닌 생성 억제·색소 치료 같은 기전·치료 표현은 불가 — 한국 기능성 미백 문구는 외관 표현으로 바꿔야 함. 인도네시아 표방 규정(PerBPOM 3/2022)의 'memutihkan' 허용 범위는 미확인"
  - claim: anti_wrinkle
    effect: drug_risk
    note: "ACD 표방 지침상 '노화로 인한 생리적 변화를 예방·감소·역전' 표현 불가 — 주름 외관 개선 표현으로 바꿔야 함"
  - claim: acne
    effect: drug_risk
    note: "치료 표현은 의약품 (추정)"
  - claim: hair_loss
    effect: drug_risk
    note: "발모·탈모 치료 표현은 의약품 (추정)"
  - claim: medical
    effect: not_allowed
    note: "질병 치료·예방 표현은 ACD 표방 지침상 화장품에 쓸 수 없음"
  - claim: halal
    effect: ok
    note: "할랄 로고는 BPJPH 할랄 인증(또는 인정 해외기관 인증서의 BPJPH 등록) 후에만 표시 → HALAL. 화장품 할랄 의무는 2028-10-17부터(PP 40/2026)"
local_entity:
  required: true
  role: "인도네시아 수입자(Importir)만 신청 가능 — 지방 UPT BPOM 시설 점검(기술책임자, 위생·보관시설, 입출고·불만·회수 절차서) 후 '노티피카시 신청인 추천서'를 받아야 함. 외국 기업 직접 신청 불가"
documents_required:
  - id: notification
    desc: "BPOM Notifkos 3.0 노티피카시 신청(PerBPOM 20/2026, 2026-10-23 제정 — 21/2022 대체, 기존 신고는 만료까지 유효)"
    satisfied_by_hint: []
    producer: company
  - id: importer_docs
    desc: "수입자 서류 — UPT BPOM 노티피카시 신청인 추천서(Rekomendasi sebagai Pemohon Notifikasi), 임원 무범죄 진술서(제20조)"
    satisfied_by_hint: []
    producer: authority
  - id: LoA
    desc: "대리점 지정서(LoA) — 인도네시아어/영어, 제조사 대표 서명, 유효기간·브랜드·신고·수입·유통 권한 명기(제20조)"
    satisfied_by_hint: []
    producer: company
  - id: CFS
    desc: "자유판매증명서(CFS) — 아세안 밖 수입품 필수, 원산국 당국 발행(제20조). 국내 발급: 대한화장품협회 제조판매증명서(KR_CFS_EXPORT). 20/2026 본문에서 아포스티유·영사확인 조항은 찾지 못함(21/2022에는 있었음 — 실무 확인)"
    satisfied_by_hint: ["cfs_kcia*"]
    producer: authority
  - id: GMP_certificate
    desc: "제조사 GMP 인증서 — 아세안 밖은 정부 발행 또는 정부 확인서가 있는 공인기관 발행(제20조). 식약처 CGMP 적합업소는 정부 발행, 민간 ISO 22716만 있으면 인정 여부 확인 필요"
    satisfied_by_hint: ["manufacturer.certs:CGMP"]
    producer: manufacturer
  - id: formula_pct
    desc: "전성분·함량(신고 입력·DIP용)"
    satisfied_by_hint: ["formula_known:full_with_concentration", "formula_composition_with_percent"]
    producer: manufacturer
  - id: PIF
    desc: "제품정보문서(DIP, ASEAN PIF) — 수입자 기술책임자가 이해·보관, 점검 시 제출. 안전성 평가서(CPSR) 미보유"
    satisfied_by_hint: []
    producer: external_expert
  - id: label_id
    desc: "인도네시아어 라벨 — 용도·사용법·경고/주의 필수, 1차·2차 포장 모두, 2D 바코드(PerBPOM 18/2024)"
    satisfied_by_hint: ["draft_from:label_kr", "draft_from:leaflet_*"]
    producer: company
tests_required: [stability, microbiology, heavy_metals]
labeling:
  language: "인도네시아어 — 용도·사용법·경고/주의사항은 필수, 제품명·성분·제조국·신고번호 등은 라틴 문자 외국어 허용(PerBPOM 18/2024 제9조)"
  allergens: null
  other: ["향료 알레르겐 개별 표시 의무 없음 — PerBPOM 25/2025(ACD 준용)·ACD 부속서 III에 해당 항목 없음", "1차·2차 포장 모두 표기, 2D 바코드 필수", "BPOM 노티피카시 번호", "할랄 로고는 BPJPH 인증 후에만. 비할랄 원료 제품은 'NON HALAL' 등 표시로 판매 가능(Peraturan BPJPH 3/2026, 2차)", "스티커 라벨 — 명문 없음, 표시(Penandaan) 정의에 '부착'이 포함돼 허용으로 해석 (추정)", "광고는 신고 완료 제품만, 인도네시아어(PerBPOM 18/2024 제13~14조)"]
animal_testing: not_required
timeline:
  lead_time: "결제 후 신청 ID 발급 → 최대 14영업일(time-to-respond, 향수 3일)"
  fee: "아세안 밖 생산 품목당 Rp1,500,000(PP 15/2026 상한제, 2차)"
  validity: "최대 3년, 갱신(pembaruan)으로 연장"
