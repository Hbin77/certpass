  fee: "NAC 인증비(견적) + NATRUE 라벨 사용료 제품당 €250/2년(100개 초과 €200), 원료 €80, 포뮬러 €250"
  validity: "인증서 2년, 자동 갱신 아님(만료 3~4개월 전 연락)"
