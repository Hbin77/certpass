# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: NATRUE
name_ko: NATRUE 천연·유기농 화장품 라벨
name_en: NATRUE Label (natural and organic cosmetics, Label Requirements v3.9)
jurisdiction: GLOBAL
kind: voluntary_certification
strategic_kr: false
general_kr_no: 137
support_rate: "50~70%, 최대 1억(중기부 일반지원 583종 137번 NATRUE Label)"
applies_to:
  product_types: [cosmetic]
  condition: "천연·유기농 표방 제품. 등급 2가지(Natural·Organic), 기준 Label Requirements v3.9(2021-01-01, 부속서 2026-06-18 갱신). NATRUE는 직접 인증하지 않고 승인 인증기관(NAC 8곳 — 한국 소재 없음)이 심사"
ingredient_rules: none
claim_rules:
  - claim: natural_origin_ingredients
    effect: ok
    note: "인증 후 NATRUE 라벨 표시 — 제품군별 천연 최소·유래천연 최대 비율 충족 필요(오일·무수 세정/스킨케어 80/20, O/W 에멀전 10/25, 계면활성제 세정제 3/85 등)"
  - claim: organic
    effect: ok
    note: "Organic 등급은 식물·동물 천연물질(과 해당 유래천연)의 95% 이상 유기농일 때"
local_entity:
  required: false
  role: null
documents_required:
  - id: application
    desc: "NATRUE 승인 인증기관(NAC) 선택·신청, NATRUE 라벨 사용 계약(회원 가입 불필요)"
    satisfied_by_hint: []
    producer: company
  - id: formula_pct
    desc: "전성분·함량(천연·자연동일·유래천연 분류와 제품군별 비율 계산)"
    satisfied_by_hint: ["formula_known:full_with_concentration", "formula_composition_with_percent"]
    producer: manufacturer
  - id: raw_material_docs
    desc: "원료 문서화 파일(RMDF) — 원료 기원·허용 공정 증명, non-GMO 선언, 향료는 ISO 9235 천연 향 증명"
    satisfied_by_hint: []
    producer: manufacturer
  - id: category_check
    desc: "제품군별 천연 최소·유래천연 최대 비율 충족 계산(표 1)"
    satisfied_by_hint: []
    producer: external_expert
  - id: brand_ratio
    desc: "브랜드(서브브랜드) 제품의 75% 이상이 인증 가능하다는 자료(§6)"
    satisfied_by_hint: []
    producer: company
  - id: label_review
    desc: "라벨 표시 검토"
    satisfied_by_hint: ["draft_from:label_kr"]
    producer: company
tests_required: []
labeling:
  language: null
  allergens: null
  other: ["NATRUE 라벨·등급(Natural/Organic) 표시", "포장: 최소화·재사용·재활용, 할로겐 플라스틱 금지, 추진가스는 공기·N2·O2·CO2·Ar만", "마스크 시트 등 캐리어는 천연·유래천연 섬유"]
animal_testing: banned
