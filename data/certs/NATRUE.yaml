blocking_rules:
  - "에톡실화 원료(PEG 등 — 유래천연 허용 반응 목록에 없음), 합성 왁스·실리콘, 부속서 3에 없는 합성 원료(세틸에틸헥사노에이트·펜타에리스리틸…) [kw:ingredient_present(PEG-*|*eth-*|*Dimethicone*|*Methicone*|*Siloxane*|Synthetic Wax|Cetyl Ethylhexanoate|Pentaerythrityl Tetra-di-t-butyl Hydroxyhydrocinnamate)]"
conditional_rules:
  - "원료 기원·가공 자료(RMDF) 없음 [kw:doc_missing(raw_material_docs)]"
  - "함량 미보유 — 제품군별 비율 계산 불가 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "1,2-헥산다이올·에틸헥실글리세린·카프릴릴글라이콜·글리세린 등은 부속서 3 등재 — 천연 원료·허용 공정 증명 시 허용, 보존제는 부속서 4a·4b만(페녹시에탄올·파라벤 불가) [kw:ingredient_present(Phenoxyethanol|*paraben|Ethylhexylglycerin|1,2-Hexanediol|Caprylyl Glycol)]"
  - "합성 자연동일 향료 불가 — ISO 9235 천연 향만, 리모넨은 에센셜오일 구성분일 때만 [kw:ingredient_present(Parfum|Fragrance|Limonene)]"
notes: "원문 확인(2026-11-07, NATRUE Label Requirements v3.9 PDF·Annex A 수수료 2025·인증 절차 페이지·NAC 목록): 성분 3유형(천연·자연동일·유래천연), 유래천연은 폐쇄 목록 반응만 허용(에톡실화 없음 → PEG 불가), 합성 향·GMO·이온화 조사·차아염소산 탈색·동물실험(제3국 포함)·미세플라스틱 금지, 팜 RSPO MB(가능 시), 제품군별 비율(오일·무수 80/20), Organic은 95% 유기농, 브랜드 75% 규칙, 인증서 2년(자동 갱신 아님), 라벨 사용료 €250/제품/2년. 클렌징밤(P1)은 오일·무수 제품군(천연 80% 이상)이라 합성 에스터 기반 현 처방은 재처방 필요. 엔진은 id(NATRUE)로 성분 natrue 속성 검사. 2차: BioGro NZ 연 NZ$2,279+α, Certisys·Ecogruppo의 한국 인정 범위(IOAS annex). 미확인: NAC 심사비, 소요 기간, NATRUE Technical Guide 세부."
