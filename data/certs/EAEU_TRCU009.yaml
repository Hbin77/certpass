blocking_rules: []
conditional_rules:
  - "TR CU 009 부속서는 통합표에 없음 — EU 기준으로 1차 선별만(부속서는 EU 76/768 기반) [kw:ingredient_list_unavailable(TRCU009)]"
  - "EU 금지성분 포함 — TR CU 009 부속서 대조 필요 [kw:ingredient_banned(EU)]"
  - "EU 제한성분 한도 초과 [kw:ingredient_restricted_over(EU)]"
  - "하이드로퀴논 — 산화 염모 0.3%·인조손톱 0.02%(전문가용)만 허용, 미백 목적 사용 불가 [kw:ingredient_present(Hydroquinone)]"
  - "결정 №74(금지·제한 목록 확대, 2026-10-28·2027-01-01 시행, 2차) 반영 확인 [kw:date_on_or_after(2026-10-28)]"
  - "EAEU 신청인 미지정 [kw:local_entity_missing(EAEU)]"
  - "인정 시험소 성적서 없음 [kw:doc_missing(test_reports_eaeu)]"
  - "향료 알레르겐 구성·함량 미확인 — 임계 초과 시 성분표 표시 [kw:ingredient_present(Parfum|Fragrance)]"
notes: "원문 확인(2026-11-07): TR CU 009/2011 EEC 공식 원판(2011) 제5~7조·부속서 2·12와 alta.ru 2024 개정판(결정 №114, 2025-12-24 시행) 제6조. 적합성 평가는 부속서 12 품목은 국가등록(EAEU_SGR), 나머지는 적합성 선언. 신청인은 회원국 등록 법인·개인사업자, 인정 시험소 성적서·GMP 문서·표방 입증 자료 필요, CFS·아포스티유 불요. 알부틴·나이아신아마이드·코직산·PEG는 부속서 미등재. EU식 향료 알레르겐 표시 규정이 있어 allergens를 채움(엔진이 향료 제품에 알레르겐 구성 확인을 요구). 2차: 결정 №74 내용, 스티커 실무. 미확인: DoC·SGR 실무 비용·기간, 한국 성적서 인정 여부."
