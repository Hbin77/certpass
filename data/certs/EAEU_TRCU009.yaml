# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: EAEU_TRCU009
name_ko: 유라시아경제연합 화장품 적합성 선언(TR CU 009/2011, EAC)
name_en: EAEU Technical Regulation TR CU 009/2011 Declaration of Conformity (EAC)
jurisdiction: EAEU
kind: mandatory_compliance
strategic_kr: false
general_kr_no: 478
support_rate: "50~70%, 최대 1억(중기부 일반지원 583종 478번 EAC)"
applies_to:
  product_types: [cosmetic]
  condition: "러시아·카자흐스탄·벨라루스·아르메니아·키르기스스탄 유통 화장품 중 부속서 12(국가등록, EAEU_SGR) 대상이 아닌 제품 — 적합성 선언(DoC, 스킴 3д·4д·6д) [kw:target_market(EAEU)]"
ingredient_rules: EU
claim_rules:
  - claim: whitening
    effect: needs_special_registration
    note: "피부 미백(톤 밝힘) 제품은 부속서 12 제2항 국가등록 대상 → EAEU_SGR"
  - claim: children
    effect: needs_special_registration
    note: "어린이용 화장품은 부속서 12 제6항 국가등록 대상 → EAEU_SGR"
  - claim: hair_dye
    effect: needs_special_registration
    note: "염모·탈색·하이라이트 제품은 부속서 12 제7항 국가등록 대상 → EAEU_SGR"
  - claim: perm
    effect: needs_special_registration
    note: "펌·스트레이트 제품은 부속서 12 제8항 국가등록 대상 → EAEU_SGR"
  - claim: anti_wrinkle
    effect: needs_evidence
    note: "라벨에 적은 효능(주름·SPF·항균 등)은 입증 자료 필요 — 지원자 시험, 모델 시험, 기기 측정 또는 성분 과학 자료(제6조 5항)"
  - claim: sunscreen
    effect: needs_evidence
    note: "SPF 표방은 입증 자료 필요(제6조 5항)"
  - claim: medical
    effect: not_allowed
    note: "치료 표현 불가 (추정)"
local_entity:
  required: true
  role: "EAEU 회원국에 등록된 신청인 — 제조사의 위임 대표(3д·6д) 또는 수입자(4д)(제6조 1항, 2024 개정판). 외국 제조사 직접 신청 불가"
documents_required:
  - id: applicant_contract
    desc: "EAEU 회원국 등록 신청인(위임 대표·수입자) 지정 계약"
    satisfied_by_hint: ["company.local_entities:EAEU"]
    producer: company
  - id: formula_pct
    desc: "부속서 2~5 성분의 농도를 적은 전성분표(제6조 5항)"
    satisfied_by_hint: ["formula_known:full_with_concentration", "formula_composition_with_percent"]
    producer: manufacturer
  - id: technical_docs
    desc: "관능·이화학 지표 문서(신청인 확인)"
    satisfied_by_hint: ["draft_from:finished_product_test_report", "draft_from:packaging_spec_*"]
    producer: manufacturer
  - id: test_reports_eaeu
    desc: "회원국 인정 시험소 성적서(제5조 3~6항 안전 요건 — 이화학·미생물·독성 등). 한국 성적서로 대체 불가 (추정)"
    satisfied_by_hint: []
    producer: lab
  - id: GMP_statement
    desc: "제조사 생산 요건 적합 문서 — GMP 준수 선언 또는 품질경영·GMP 인증서(ISO 22716 가능)"
    satisfied_by_hint: ["manufacturer.certs:ISO 22716", "manufacturer.certs:CGMP"]
    producer: manufacturer
  - id: DoC_registered
    desc: "적합성 선언(DoC) — 인정 인증기관에 등록(제6조 6항)"
    satisfied_by_hint: []
    producer: authority
  - id: label_ru
    desc: "판매 회원국 국어 라벨(러시아는 러시아어)과 EAC 마크 — 제조사 이름·주소·제품명은 라틴 문자 가능"
    satisfied_by_hint: ["draft_from:label_kr"]
    producer: company
tests_required: [physicochemical, microbiology, toxicology, local_lab_test]
labeling:
  language: "판매 회원국 국어(러시아는 러시아어) — 제조사 이름·주소와 제품명은 라틴 문자 가능, 전성분은 국어 또는 INCI(제5조 9.3·9.5)"
  allergens: "부속서 2 №67~92 향료 알레르겐 — 씻어내는 제품 0.01%·바르는 제품 0.001% 초과 시 성분표에 표시(제5조 9.3, 리모넨은 №88)"
  other: ["EAC 마크(제7조) — 포장·라벨 또는 동봉 서류", "필수 항목: 제품명, 용도, 어린이용 표시, 제조사 이름·주소(국가), 원산국, 소비자 불만 접수 위임 대표·수입자, 내용량, 사용기한, 보관 조건, 주의사항, 배치번호, 사용법, 전성분(제5조 9.2)", "동봉 설명서가 있으면 '펼친 책 위 손' 기호(부속서 11)", "번역 서류는 공증 또는 자격 번역사 서명(제6조 5항)", "스티커 부착 — 실무상 허용(2차)"]
animal_testing: not_required
timeline:
  lead_time: "시험 포함 1~2개월 (추정)"
  fee: "국가 수수료 없음 (추정) — 인정 시험소·인증기관 비용(금액 미확인)"
  validity: "적합성 선언 — 3д 스킴 최대 5년, 6д 스킴 최대 7년(2024 개정판 제6조)"
