blocking_rules:
  - "동물성 원료 포함(육·란·유·젤라틴·곤충·조개(진주)·꿀·로열젤리·밀랍·라놀린·카민·실크·달팽이 점액 등, 특정 성분 제조에 간접 이용 포함) [kw:ingredient_animal_derived]"
  - "완제품·원료 동물실험 실시(타사 위탁 포함) [kw:animal_test_data_present]"
conditional_rules:
  - "기원 확인이 필요한 원료(글리세린·지방산 에스터·세틸알코올·스쿠알란·콜라겐·케라틴 등) [kw:ingredient_origin_unknown(animal)]"
  - "OEM 계약서 미보유 [kw:doc_missing(OEM_contract)]"
  - "교차오염 방지 기준서 없음 [kw:doc_missing(cross_contamination)]"
  - "중국 특수화장품 注册(독성시험 필수)을 함께 추진 — 동물실험 금지 정책과 충돌 가능 (추정) [kw:card_verdict(CN_NMPA_SPECIAL,조건부|통과 가능)]"
notes: "원문 확인(2026-11-07, vegan-korea.com 인증 안내·FAQ, 문서 §4-6·§4-4 ◎): 기준 3가지(동물 유래 원료 미사용 — 간접 이용 포함, 동물실험 금지 — 타사 위탁 포함, 생산 전·중·후 교차오염 방지), 심사(서류·교차오염 방지 기준서·동물성 유전자 검사·현장 조사), 서류(신청서·OEM 위수탁 계약서·사업자등록증), 45~60 업무일, 1년 또는 2년, 종료 3개월 전 연장, 비용 비공개. 누적 1,879개사·11,508제품(2026-06). 엔진은 id(VEGAN)로 성분 vegan 속성 검사(진주·꿀·밀랍·라놀린·유당 등 불가, 글리세린 등 기원 확인). 미확인: FAQ 2~3쪽(JS), 공장 방문 여부, 유전자 검사 방법, 원료·해외 법정 동물실험 범위, 해외규격인증 지원 대상 여부(국내 인증이라 아닐 가능성, 추정)."
