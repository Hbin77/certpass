    level: direct
    checked: 2026-11-07
blocking_rules: []
conditional_rules:
  - "기능성 표방인데 보고·심사 자료 없음 — 보고 없이 기능성 표방 판매 시 판매업무정지 3~12개월 [kw:doc_missing(functional_report_or_review)]"
  - "보고 자료가 없고 효능 성분·함량·제형·문구가 고시 별표 4와 다름 — 심사 대상(18.9~21만 원) [kw:doc_missing(functional_report_or_review)] [kw:manual_check(KR_annex4_match)]"
  - "미백+주름 이중 기능성 — (미백 성분, 주름 성분, 제형)이 고시 2025-89 별표 5 조합인지 확인(나이아신아마이드+아데노신 크림 조합은 있음) [kw:claim(whitening)] [kw:claim(anti_wrinkle)] [kw:doc_missing(functional_report_or_review)]"
  - "기능성 계획 단계(처방 미확정) [kw:formula_known(concept_only)]"
notes: "원문 확인(문서 §4-8 ◎): 보고 대상 판정(법 §4①, 규칙 §10①, 고시 2025-88 별표 4 — 자료 제출이 생략되는 기능성화장품), 이중 기능성은 고시 2025-89 별표 5 조합이어야 하며 나이아신아마이드+아데노신 크림 조합이 있어 크림 보고는 적법, 보고 0원·심사 18.9~21만 원, 보고 품목은 변경보고 없음(취하 후 재보고), 미보고 기능성 표방 판매 시 판매업무정지 3~12개월(규칙 별표 7). claims_any에는 작업 지시의 whitening·anti_wrinkle 외에 다른 기능성 8종(자외선 차단·염모·탈색·제모·탈모·여드름·아토피 건조·튼살)도 넣었음 — 현재 제품 판정에는 영향 없음, 기능성 유형 목록은 (추정). 해외 판정과의 관계: 중국 미백(특수 注册)·일본 미백·주름(의약부외품)은 한국 보고 자료로 대신할 수 없고 근거 초안으로만 사용 (추정). 처리기간은 미확인."
