blocking_rules:
  - "ASEAN 금지성분 포함(EU 준용 대조 — 하이드로퀴논·수은·디옥시아르부틴 등) [kw:ingredient_banned(ASEAN)]"
  - "ASEAN 제한성분 한도 초과 [kw:ingredient_restricted_over(ASEAN)]"
  - "보존제·UV필터·색소가 허용목록 밖 [kw:ingredient_positive_list_missing(ASEAN)]"
conditional_rules:
  - "ASEAN 값은 EU 행 대용 — ACD 부속서(Circular 06 제14~15조 준용)와 차이 확인 [kw:ingredient_list_unavailable(ASEAN_ACD)]"
  - "제한성분 함량 미상 [kw:ingredient_restricted_conc_unknown(ASEAN)]"
  - "배합 함량 미보유 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "베트남 책임 조직 미지정 [kw:local_entity_missing(VN)]"
  - "CFS(영사확인 또는 수용 확인된 아포스티유) 미준비 [kw:doc_missing(CFS_legalized)]"
  - "위임장 공증·영사확인 미준비 [kw:doc_missing(LoA_legalized)]"
  - "PIF 안전성 평가 없음 [kw:doc_missing(PIF)]"
notes: "원문 확인(2026-11-07, Circular 06/2011·32/2019·41/2023, HSA 게시 ACD 문서): 베트남 화장품 영업 조직만 신고, CFS 영사확인 필수(CPTPP 원산 면제 — 한국 비해당), 위임장 공증·영사확인, 건당 500,000 VND, 유효 5년, 보조 라벨 허용. 아세안은 향료 알레르겐 표시 의무가 없어 allergens를 비움. 2차: 실무 처리 1~3개월, 광고 금지 표현·2026-02-15 광고 사전심의 폐지(chemlinked·tuoitre), 제19조 베트남어 필수 항목(원문 인용 미확보). 미확인: 무기한화 신규 시행령 공포 여부, 아포스티유 CFS의 DAV 수용 여부."
