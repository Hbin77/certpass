# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: TH_FDA
name_ko: 태국 화장품 노티피케이션(Thai FDA)
name_en: Thailand FDA Cosmetic Notification (Cosmetic Act B.E. 2558)
jurisdiction: TH
kind: mandatory_registration
strategic_kr: false
general_kr_no: 278
support_rate: "50~70%, 최대 1억(중기부 일반지원 583종 278번 태국FDA)"
applies_to:
  product_types: [cosmetic]
  condition: "태국 제조·수입·판매 화장품 전부(출시 전 노티피케이션 จดแจ้ง, 화장품법 B.E. 2558 제15조, e-Submission) [kw:target_market(TH)]"
ingredient_rules: ASEAN
claim_rules:
  - claim: whitening
    effect: drug_risk
    note: "미백 제품 자체는 ACD상 화장품 범위, 멜라닌 생성 억제·색소 치료 같은 기전·치료 표현은 불가 — 한국 기능성 미백 문구는 외관 표현으로 바꿔야 함. 하이드로퀴논은 금지(태국 금지 고시 1243번). 태국 2567 광고 문구 규칙 내용은 미확인"
  - claim: anti_wrinkle
    effect: drug_risk
    note: "ACD 표방 지침상 '노화로 인한 생리적 변화를 예방·감소·역전' 표현 불가 — 주름 외관 개선 표현으로 바꿔야 함"
  - claim: acne
    effect: drug_risk
    note: "치료 표현은 의약품 (추정)"
  - claim: hair_loss
    effect: drug_risk
    note: "탈모 치료 표현은 의약품 (추정)"
  - claim: medical
    effect: not_allowed
    note: "질병 치료·예방 표현은 ACD 표방 지침상 화장품에 쓸 수 없음"
local_entity:
  required: true
  role: "태국 내 신고인(제조자·수탁제조자·수입자) — 신고 시스템의 Digital ID가 태국 국적을 요구해 외국 기업은 직접 신고 불가. 수입자는 수입 사업장 승인을 먼저 받아야 함, 위임장 유효 1년"
documents_required:
  - id: notification
    desc: "Thai FDA e-Submission 노티피케이션(จดแจ้ง)"
    satisfied_by_hint: []
    producer: company
  - id: LoA
    desc: "브랜드 소유자의 수입자 승인서(Letter of Authorization) — 신고 서류(Q&A Q7)"
    satisfied_by_hint: []
    producer: company
  - id: formula_pct
    desc: "전성분 배합표(Formula) — 신고 서류(Q&A Q7), 특수 제형은 추가 자료"
    satisfied_by_hint: ["formula_known:full_with_concentration", "formula_composition_with_percent"]
    producer: manufacturer
  - id: PIF
    desc: "PIF 보관 — 신고 서류 일체와 서명 안전성 평가 포함(ACD 제8조 준용). 현재 안전성 평가서(CPSR) 미보유"
    satisfied_by_hint: []
    producer: external_expert
  - id: label_th
    desc: "태국어 라벨 — 수입품은 통관 후 30일 안에 부착 완료(스티커 가능)"
    satisfied_by_hint: ["draft_from:label_kr"]
    producer: company
tests_required: [stability, microbiology, heavy_metals]
labeling:
  language: "태국어 필수(성분명은 영어 가능) — 수입품은 통관 때 면제, 통관 후 30일 안에 태국어 라벨 부착(스티커 가능)"
  allergens: null
  other: ["향료 알레르겐 개별 표시 의무 없음 — 태국 제한물질 고시(2561)·ACD 부속서 III에 해당 항목 없음", "노티피케이션 번호", "ACD 라벨 항목 준용(제품명·기능, 사용법, 전성분, 제조국, 책임 회사, 내용량, 배치번호, 제조일·사용기한, 주의사항) (추정)"]
animal_testing: not_required
timeline:
  lead_time: "기준 적합 시 3영업일(자동), 라벨 심사 10일, 사전 심사 25일"
  fee: "신청 100 THB + 접수증 제품당 900 THB(변경 500, 재발급 100) — 2567 심사비 고시 금액은 미확인"
  validity: "3년, 만료 180일 전부터 갱신. 늦으면 법인 1일 1,000 THB 벌금, 1개월을 넘기면 신규 신고"
