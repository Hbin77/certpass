blocking_rules:
  - "ASEAN 금지성분 포함(EU 준용 대조) [kw:ingredient_banned(ASEAN)]"
  - "ASEAN 제한성분 한도 초과 [kw:ingredient_restricted_over(ASEAN)]"
  - "보존제·UV필터·색소가 허용목록 밖 [kw:ingredient_positive_list_missing(ASEAN)]"
conditional_rules:
  - "ASEAN 값은 EU 행 대용 — 태국 보건부 금지(2559~2569)·제한(2561~2567) 고시와 차이 확인 [kw:ingredient_list_unavailable(TH_INGREDIENTS)]"
  - "제한성분 함량 미상 [kw:ingredient_restricted_conc_unknown(ASEAN)]"
  - "배합 함량 미보유 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "태국 신고인(승인된 수입 사업장) 미지정 [kw:local_entity_missing(TH)]"
  - "수입자 승인서(LoA) 없음 [kw:doc_missing(LoA)]"
  - "PIF 안전성 평가 없음 [kw:doc_missing(PIF)]"
  - "영어가 아닌 서류는 국가 공인기관(대학 어학원 등) 태국어 번역 첨부 [kw:manual_check(TH_translation)]"
notes: "원문 확인(2026-11-07, Thai FDA 기준서·Q&A·FAQ·화장품법 B.E. 2558): 신고인은 태국 제조·수탁제조·수입자(Digital ID 태국 국적), 신고 서류는 전성분+LoA(비영어는 공인 번역), CFS·GMP·공증·아포스티유는 신고 때 요구 없음 — 그래서 GMP 증빙 서류를 뺐다. 100+900 THB, 3영업일 자동, 유효 3년(180일 전 갱신), 수입품 태국어 라벨은 통관 후 30일 안. 아세안은 향료 알레르겐 표시 의무가 없어 allergens를 비움. 미확인: 2567 심사비 고시 금액(PDF 글꼴 인코딩), 수입 사업장 승인 서류 상세, 알부틴 개별 규정, 2567 광고 문구 규칙."
