blocking_rules:
  - "기준일(2013-03-11) 이후 완제품·원료 동물실험 실시·위탁·관여 [kw:animal_test_data_present]"
  - "중국 특수화장품 注册(독성시험 필수) 대상으로 중국 출시 — 법정 동물실험과 양립 불가 (중국 특수 포기 시 재판정) [kw:target_market(CN)] [kw:card_verdict(CN_NMPA_SPECIAL,조건부|통과 가능)]"
conditional_rules:
  - "중국 판매 — 국경 간 전자상거래(CBEC)는 사전·사후 동물실험 요구가 없어 허용, 중국 내 등록 판매는 China Qualification Program(사전·사후 감사, 요구 시 회수 서약) 조건 [kw:target_market(CN)]"
  - "공급사 동물실험 미실시 선언(12개월 이내) 없음 [kw:doc_missing(supplier_monitoring)]"
  - "독립 감사 미실시 [kw:doc_missing(independent_audit)]"
  - "원료의 비화장품 목적 법정 사후 시험은 증거를 내면 허용 — 해당 원료 확인 [kw:manual_check(LB_non_cosmetic_testing)]"
notes: "원문 확인(2026-11-07, CFI 화장품 가이드라인 2020판(ICEA 게시 사본)·CCIC 표준·FAQ): 한국 기업은 CFI 경로(CCIC는 미국·캐나다 본사만, 무료), FCOD 2013-03-11, 회사·대리인의 동물실험 수행·위탁·관여 금지, 공급사 모니터링(완제품·원료 제조사 선언 12개월 이내), 독립 감사(최초·2~3년·3년마다), 연례 갱신(4월), 동물=척추동물·두족류, 비건 성분 여부는 심사 안 함, 자사 브랜드만(OEM 제조사 불가), 신청비 £300·연 £149~9,995, 검토 4주. 중국: CBEC 허용, 중국 내 등록 판매는 China Qualification Program. 583종 목록 밖(원문 ◎: 비공고 규격인증으로 신청). 성분 기준이 아니라 동물실험 기준이라 엔진의 성분 속성 검사는 적용하지 않음. 미확인: CFI 현행 요율표, CFI 중국 공식 페이지(404)."
