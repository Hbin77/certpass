# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: LEAPING_BUNNY
name_ko: 리핑버니(크루얼티프리) 인증
name_en: Leaping Bunny Programme (Cruelty Free International / CCIC)
jurisdiction: GLOBAL
kind: marketing_label
strategic_kr: false
general_kr_no: null
support_rate: "583종 목록에 없음 — 비공고 규격인증으로 신청 시 운영위원회 심의(비건 등 민간 인증도 수출에 매우 중요하면 지원 예정, 단순 마케팅·홍보용 제외)"
applies_to:
  product_types: [cosmetic]
  condition: "크루얼티프리 표방 — 자사 브랜드(OEM 제조사는 신청 불가) 단위로 전 제품 동물실험 미실시를 약속. 한국 기업은 Cruelty Free International(영국) 경로(미국·캐나다 본사는 CCIC, 무료) — 비건 성분 여부는 심사하지 않음"
ingredient_rules: none
claim_rules:
  - claim: cruelty_free
    effect: ok
    note: "승인 후 Leaping Bunny 로고 사용 — 다른 인증 서류로 대체 불가"
local_entity:
  required: false
  role: null
documents_required:
  - id: application
    desc: "신청서·비밀유지 계약(NDA) — 신청비 £300+VAT(18개월 유효)"
    satisfied_by_hint: []
    producer: company
  - id: cut_off_declaration
    desc: "회사 동물실험 정책 — 화장품 고정 기준일(FCOD) 2013-03-11 이후 동물실험 원료·제품 구매·위탁·관여 금지"
    satisfied_by_hint: []
    producer: company
  - id: supplier_monitoring
    desc: "공급사 모니터링 체계(SMS) — 완제품 제조사(㈜엔에프씨 등)와 전 원료 제조사의 동물실험 미실시 선언서, 12개월 이내 서명본 유지"
    satisfied_by_hint: []
    producer: manufacturer
  - id: independent_audit
    desc: "독립 감사 — 신청 때 최초 감사, 승인 후 2~3년 안에, 이후 3년마다(원격 가능)"
    satisfied_by_hint: []
    producer: external_expert
  - id: annual_recommitment
    desc: "연례 재서약과 라이선스비 납부(매년 4월)"
    satisfied_by_hint: []
    producer: company
tests_required: []
labeling:
  language: null
  allergens: null
  other: ["Leaping Bunny 로고·라이선스 번호 (추정)"]
animal_testing: banned
timeline:
  lead_time: "신청 검토 최대 4주(CFI) + 공급사 선언서 수집 기간"
  fee: "신청비 £300+VAT, 연 라이선스비 £149(연매출 £2만 이하)~£9,995(£2천만 초과)(예: £5만~15만 £449, £15만~30만 £649, £50만~200만 £1,495) — CFI 2020판 가이드라인, 현 사이트에는 요율표 미게시"
  validity: "매년 4월 갱신(연례 재서약), 독립 감사는 최초 + 2~3년 안에 + 이후 3년마다"
