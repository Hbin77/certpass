# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: CA_CNF
name_ko: 캐나다 화장품 사전신고(CNF)
name_en: Health Canada Cosmetic Notification Form (CNF)
jurisdiction: CA
kind: mandatory_registration
strategic_kr: false
general_kr_no: 361
support_rate: "50~70%, 최대 1억(중기부 일반지원 583종 361번 CNF)"
applies_to:
  product_types: [cosmetic]
  condition: "캐나다 판매 화장품 — 첫 판매 후 10일 내 CNF 제출. 의약품·천연건강제품(NHP) 표방 제품은 별도 경로 [kw:target_market(CA)]"
ingredient_rules: CA   # 식약처 화장품 사용제한 원료정보 API(국가별 금지·한도)
claim_rules:
  - claim: sunscreen
    effect: needs_special_registration
    note: "자외선차단은 의약품 또는 NHP(성분별) — CNF 대상 아님 (추정). 583종 369번 NHP 비고: 자외선차단 등 건강 효능 표방 제품만 NHP"
  - claim: acne
    effect: needs_special_registration
    note: "여드름 치료는 의약품·NHP 경로 (추정)"
  - claim: anti_dandruff
    effect: needs_special_registration
    note: "비듬 방지는 의약품 (추정)"
  - claim: whitening
    effect: drug_risk
    note: "피부 표백·색소 억제 표현은 의약품 위험 (추정)"
  - claim: anti_wrinkle
    effect: drug_risk
    note: "구조·기능 변화 표현은 의약품 위험, 외관 표현은 화장품 (추정)"
  - claim: medical
    effect: not_allowed
    note: "치료·예방 표현 불가 (추정)"
local_entity:
  required: true
  role: "2025-03부터 CNF에 캐나다 주소(캐나다 내 수입·판매자 등) 필수"
documents_required:
  - id: CNF
    desc: "CNF(첫 판매 후 10일 내): 제품·제조사·수입자 정보, INCI 전성분과 정확 농도 또는 농도 범위 코드"
    satisfied_by_hint: ["formula_known:full_with_concentration", "formula_composition_with_percent"]
    producer: company
  - id: canadian_address
    desc: "캐나다 주소·연락처(2025-03부터 필수)"
    satisfied_by_hint: ["company.local_entities:CA"]
    producer: company
  - id: label_ca
    desc: "영어·프랑스어 이중 언어 라벨 (추정)"
    satisfied_by_hint: ["draft_from:label_kr", "draft_from:leaflet_*"]
    producer: company
  - id: safety_evidence
    desc: "안전성 근거(요청 시 제출) (추정)"
    satisfied_by_hint: ["draft_from:finished_product_test_report", "draft_from:skin_irritation_test"]
    producer: company
tests_required: [stability, microbiology]
labeling:
  language: "영어·프랑스어 병기 (추정)"
  allergens: "향료 알레르겐 개별 표시 의무 도입(2026년 단계 시행) — 시행일 확인 필요 (추정)"
  other: ["INCI 전성분 (추정)", "캐나다 내 판매자 이름·주소 (추정)", "미터법 순내용량 (추정)", "경고·주의 문구 (추정)"]
animal_testing: banned
timeline:
  lead_time: "온라인 제출(첫 판매 후 10일 내)"
  fee: "무료 (추정)"
  validity: "변경·판매 중단 시 수정 신고 (추정)"
evidence:
  - url: "local:트랙B_데이터모델_조사정리_20261107.md#4-3"
    level: direct
    checked: 2026-11-07
  - url: "https://www.canada.ca/en/health-canada/services/consumer-product-safety/cosmetics.html"
    title: "cosmetics"
    level: unverified
    checked: 2026-11-07
blocking_rules: []
conditional_rules:
  - "캐나다 Hotlist(금지·제한 성분)는 HTML만 있어 통합표에 없음 — 대조 필요 [kw:ingredient_list_unavailable(CA_HOTLIST)]"
  - "농도 또는 범위 미보유 — CNF 작성 불가 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "캐나다 주소 미확보 [kw:local_entity_missing(CA)]"
  - "이중 언어 라벨 미작성 [kw:doc_missing(label_ca)]"
  - "EU 금지성분 포함 — Hotlist 해당 가능성 높음, 확인 필요 (추정) [kw:ingredient_banned(EU)]"
notes: "원문 확인(문서 §4-3 ◎): 첫 판매 후 10일 내 CNF, INCI + 정확 농도 또는 범위 코드, 2025-03부터 캐나다 주소 필수, Hotlist는 HTML만(상업 재배포는 사전 서면 허가). 583종 366번 DSL(캐나다 국내물질목록)은 성분이 DSL 미등재일 때 신규물질 신고 — 이 카드에서는 다루지 않음. 이중 언어 라벨·알레르겐 시행일·동물실험 금지·수수료는 (추정)."
