# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: JP_QUASI_DRUG
name_ko: 일본 의약부외품(약용화장품) 製造販売承認
name_en: Japan Quasi-drug (医薬部外品) Marketing Approval
jurisdiction: JP
kind: mandatory_registration
strategic_kr: false
general_kr_no: 235
support_rate: "50~70%, 최대 1억(중기부 일반지원 583종 235번 PMDA)"
applies_to:
  product_types: [whitening, anti_wrinkle, acne, antibacterial, hair_dye, hair_loss, medicated]
  condition: "일본에서 미백·주름 개선·여드름 예방·살균 등 약용 효과나 염모·육모를 표방하는 제품 [kw:target_market(JP)] [kw:claim(whitening|anti_wrinkle|acne|antibacterial|hair_dye|hair_loss)]"
ingredient_rules: JP
claim_rules:
  - claim: whitening
    effect: ok
    actives_any: [NIACINAMIDE, ARBUTIN, TRANEXAMIC ACID, ASCORBYL GLUCOSIDE, MAGNESIUM ASCORBYL PHOSPHATE, 3-O-ETHYL ASCORBIC ACID, KOJIC ACID, POTASSIUM METHOXYSALICYLATE, 4-BUTYLRESORCINOL, ELLAGIC ACID, CETYL TRANEXAMATE HCL]
    note: "승인된 유효성분·함량 범위에서 승인 받은 효능 문구('멜라닌 생성을 억제해 기미·주근깨를 막는다' 등)만 사용. 유효성분 목록은 승인 전례 대표 성분 (추정)"
  - claim: anti_wrinkle
    effect: ok
    actives_any: [RETINOL, NIACINAMIDE, NEI-L1, RICE POWER NO.11+, VEP-M]
    note: "'주름 개선'은 승인 전례 유효성분(레티놀·나이아신아마이드·NEI-L1·라이스파워 No.11+·VEP-M)으로만. 아데노신은 일본에서 육모 유효성분(2004)이며 주름 개선 유효성분 아님 (성분속성표 6번 판정)"
  - claim: acne
    effect: ok
    note: "약용 여드름 예방 효능은 승인 범위 내 (추정)"
  - claim: medical
    effect: not_allowed
    note: "질병 치료 표현은 의약품 영역 (추정)"
local_entity:
  required: true
  role: "일본 의약부외품 製造販売業 허가 보유자(일본 법인) (추정)"
documents_required:
  - id: MAH_QD_license
    desc: "의약부외품 製造販売業許可証(일본 MAH)"
    satisfied_by_hint: ["company.local_entities:JP"]
    producer: company
  - id: foreign_manufacturer_accreditation
    desc: "한국 제조소의 外国製造業者 인정(認定) (추정)"
    satisfied_by_hint: []
    producer: authority
  - id: approval_application
    desc: "製造販売承認申請書(법 14조 승인) — 성분·분량, 제조방법, 용법·용량, 효능·효과, 규격·시험방법 (세부 항목은 추정)"
    satisfied_by_hint: []
    producer: company
  - id: spec_test_methods
    desc: "規格及び試験方法 자료 (추정)"
    satisfied_by_hint: ["draft_from:bulk_test_report", "draft_from:finished_product_test_report"]
    producer: manufacturer
  - id: stability_data
    desc: "안정성 시험 자료 (추정)"
    satisfied_by_hint: []
    producer: lab
  - id: safety_efficacy_data
    desc: "신규 유효성분·신규 배합이면 안전성·유효성 자료, 승인 전례 범위면 축소 (추정)"
    satisfied_by_hint: ["draft_from:functional_report_*"]
    producer: lab
  - id: additive_compliance
    desc: "첨가물이 의약부외품 원료규격·첨가물 목록 범위인지 확인 (추정)"
    satisfied_by_hint: ["formula_known:full_with_concentration"]
    producer: manufacturer
  - id: label_jp_qd
    desc: "'医薬部外品' 표시 등 일본어 라벨 (추정)"
    satisfied_by_hint: ["draft_from:label_kr", "draft_from:leaflet_*"]
    producer: company
tests_required: [stability, microbiology, physicochemical, efficacy_human, toxicology]
labeling:
  language: "일본어"
  allergens: null
  other: ["알레르겐 — 개별 표시 의무 없음 (추정)", "'医薬部外品' 표시 (추정)", "有効成分 표시 (추정)", "製造販売業者 이름·주소 (추정)", "名称·製造番号·内容量 (추정)", "전성분(업계 자율기준) (추정)"]
animal_testing: required_for_some
timeline:
  lead_time: "승인 심사 6~12개월 이상 (추정)"
  fee: "PMDA·지자체 심사 수수료 있음 (추정)"
  validity: "승인 유효기간 없음, MAH 허가 갱신 별도 (추정)"
evidence:
  - url: "local:조사자료_20261107/규제원문_dl_jp/qa_r7.txt"
    level: direct
    checked: 2026-11-07
  - url: "local:트랙B_데이터모델_조사정리_20261107.md#4-3"
    level: secondary
    checked: 2026-11-07
  - url: "https://www.pmda.go.jp"
    title: "独立行政法人 医薬品医療機器総合機構"
    level: unverified
    checked: 2026-11-07
blocking_rules:
  - "일본 금지성분 포함(화장품기준 대용 확인) [kw:ingredient_banned(JP)]"
conditional_rules:
  - "미백·주름 유효성분의 일본 승인 전례·함량 범위 확인 필요 (추정) [kw:manual_check(JP_QD_active_precedent)]"
  - "의약부외품 첨가물 기준은 통합표에 없음 — 화장품기준(JP)으로 대용 선별만 됨 [kw:ingredient_list_unavailable(JP_QD_ADDITIVES)]"
  - "배합량 미보유 또는 개념 단계 — 승인 신청 불가 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "의약부외품 MAH 미확보 [kw:local_entity_missing(JP)]"
  - "외국제조업자 인정 미취득 [kw:doc_missing(foreign_manufacturer_accreditation)]"
notes: "원문 확인(◎): 의약부외품은 품목별 製造販売承認(법 14조) 대상(R7 Q&A 1·2 각주), 약용화장품(여드름 예방·살균)=의약부외품(Q&A 72), 염모제=지정 의약부외품(Q&A 71). 미백·주름 개선이 의약부외품 영역이라는 판단은 문서 §4-3에서 ○(일반 지식, 원문 미확인). 승인 서류·심사 기간·수수료·외국제조업자 인정 절차·첨가물 기준은 전부 (추정). 한국 기능성(미백·주름) 보고 자료는 근거 초안 원천으로만 쓰고 일본 승인 자료를 대신하지 못함 (추정). ingredient_rules JP는 화장품기준으로 대용한 값."
