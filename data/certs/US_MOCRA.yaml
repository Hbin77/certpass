blocking_rules:
  - "21 CFR 700 금지 성분 포함 — 비티오놀, 수은화합물(눈 주변 극미량 예외), 염화비닐·지르코늄(에어로졸), 할로겐화 살리실아닐라이드, 클로로포름, 염화메틸렌, CFC 추진제, 금지 소 유래 물질 (추정) [kw:ingredient_present(Bithionol|*Mercur*|Vinyl Chloride|Chloroform|Methylene Chloride|*Salicylanilide*)]"
conditional_rules:
  - "미국 대리인 미지정 [kw:local_entity_missing(US)]"
  - "라벨에 미국 연락처(주소·전화·전자) 미반영 [kw:doc_missing(label_us)]"
  - "위탁제조 시설 FEI·시설등록 미확인 [kw:doc_missing(facility_registration)]"
  - "안전성 입증 기록 미비 [kw:doc_missing(safety_substantiation)]"
  - "색소 사용 — FDA 승인 색소(21 CFR 73·74·82)·배치 인증 대상 확인 필요 (추정) [kw:ingredient_present(CI *|*Lake*|*FD&C*|*D&C*)]"
  - "헥사클로로펜 사용 — 제한 조건 확인 (추정) [kw:ingredient_present(Hexachlorophene)]"
  - "INCI 매칭 실패 성분 존재 [kw:ingredient_match_unresolved]"
notes: "원문 확인(◎): 등록·리스팅 항목, 소기업 면제와 예외, 위탁제조사 1회 등록, 수수료 없음, 2년·1년 갱신, 120일·60일 기한, 해외 시설 미국 대리인, 라벨의 미국 주소·전화·전자 연락처(웹사이트 가능) 중 하나, 의약품 겸용 제품은 리스팅 제외. FDA는 인증서를 발급하지 않음. GMP·향료 알레르겐·탈크 석면 시험 규칙은 미공표·초안 단계. 금지 성분 목록(21 CFR 700)·색소 규정·드럭 표방 경계는 (추정). 캘리포니아 판매 시 US_PROP65 별도."
