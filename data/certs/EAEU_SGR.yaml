blocking_rules: []
conditional_rules:
  - "TR CU 009 부속서는 통합표에 없음 — EU 기준으로 1차 선별만 [kw:ingredient_list_unavailable(TRCU009)]"
  - "EU 금지성분 포함 — TR CU 009 대조 필요 [kw:ingredient_banned(EU)]"
  - "EU 제한성분 한도 초과 [kw:ingredient_restricted_over(EU)]"
  - "하이드로퀴논 — 미백 목적 사용 불가(염모 0.3%·인조손톱 0.02%만) [kw:ingredient_present(Hydroquinone)]"
  - "배합 함량 미보유 또는 개념 단계 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "EAEU 신청인 미지정 [kw:local_entity_missing(EAEU)]"
  - "인정 시험소 시험 없음 [kw:doc_missing(test_reports_eaeu)]"
notes: "원문 확인(2026-11-07): TR CU 009/2011 EEC 원판 제6조 3·4항(국가등록 절차·서류)·부속서 12(대상 13종), alta.ru 2024 개정판 제6조(SGR 5년). 부속서 12 목록을 원문대로 product_types에 넣었고, 표방 태그가 대상 제품(선탠·필링 등)을 '해당 없음'으로 막지 않도록 condition의 claim 태그를 뺐다. 미백(아쿠아라이트닝크림·흑진주 마스크)은 적합성 선언(EAEU_TRCU009) 대신 이 경로. EU식 향료 알레르겐 표시 규정이 있어 allergens를 채움. 미확인: 등록 비용·기간, 회원국별 등록기관 실무."
