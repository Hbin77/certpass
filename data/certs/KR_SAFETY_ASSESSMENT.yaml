notes: "원문 확인(법률 제21302호 부칙 ◎, 식약처 안내서-1506-01(2026-06-10)은 문서 §4-8 ◎): 유통 전 제품별 안전성 평가 자료 작성 → 평가자 검토 → 보관. 보고서 항목: 조성·안정성·미생물·불순물·노출·MOS·독성·유해사례·결론·서명. 시행일 구분은 timeline.validity 참고. 지금은 의무 전이라 documents_required를 비워 두었고 엔진 판정은 '통과 가능(현행 의무 없음)'으로 나옴 — 화면에서는 시행일 안내로 표시 권장. 회사 연 생산액이 데이터에 없어(문서 §4-8 미확인) 2028·2030 적용 여부 미정 — 10억 원 미만이면 2031-01-01. 개정 후 영유아·어린이 화장품 관리 조항은 §4의2 → §4의3으로 이동. 준비는 SCCS 노출·MoS 수치(문서 §4-7)로 미리 가능. 평가자 자격 요건은 미확인."
