# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: PH_FDA
name_ko: 필리핀 화장품 노티피케이션(FDA Philippines)
name_en: Philippines FDA Cosmetic Product Notification (CPN)
jurisdiction: PH
kind: mandatory_registration
strategic_kr: false
general_kr_no: 388
support_rate: "50~70%, 최대 1억(중기부 일반지원 583종 388번 PFDA)"
applies_to:
  product_types: [cosmetic]
  condition: "필리핀 수입·유통 화장품 전부 — FDA e-portal 노티피케이션으로 CPN 발급(CCHUHSRR). 향수류는 자동 신고 시범(2026-10~12) [kw:target_market(PH)]"
ingredient_rules: ASEAN
claim_rules:
  - claim: whitening
    effect: drug_risk
    note: "미백 제품 자체는 ACD상 화장품 범위, 멜라닌 생성 억제·색소 치료 표현은 불가 — ACD 범위를 넘는 표방은 CPN 취소 사유. 하이드로퀴논 제품은 의약품 분류"
  - claim: anti_wrinkle
    effect: drug_risk
    note: "ACD 표방 지침상 '노화로 인한 생리적 변화를 예방·감소·역전' 표현 불가 — 주름 외관 개선 표현으로 바꿔야 함"
  - claim: acne
    effect: drug_risk
    note: "치료 표현은 의약품 (추정)"
  - claim: medical
    effect: not_allowed
    note: "질병 치료·예방 표현은 ACD 표방 지침상 화장품에 쓸 수 없음 — ACD 범위 초과 표방은 CPN 취소"
local_entity:
  required: true
  role: "유효한 영업허가(LTO)를 받은 필리핀 화장품 업체(Distributor-Importer/Trader/Manufacturer)만 신고 가능 — 외국 기업 직접 신고 불가, LTO 보유자가 시판 허가 보유자로 책임. LTO 유효기간은 소기업 3년·중대기업 6년(AO 2024-0015, 2차)"
documents_required:
  - id: notification
    desc: "FDA e-portal 신청서와 Declaration and Undertaking — 표준 요건은 LTO와 e-portal 계정뿐, 기본 제출 서류 없음"
    satisfied_by_hint: []
    producer: company
  - id: LoA
    desc: "브랜드 소유자·제조사 위임장 (추정)"
    satisfied_by_hint: []
    producer: company
  - id: formula_pct
    desc: "전성분·제한성분 함량 — ACD 부속서 적합 선언용 (추정)"
    satisfied_by_hint: ["formula_known:full_with_concentration", "formula_composition_with_percent"]
    producer: manufacturer
  - id: PIF
    desc: "ASEAN PIF — 현지 업체 보유, FDA 사후 감사 대상(FDA Circular 2023-001), 서명 안전성 평가 포함. 현재 안전성 평가서(CPSR) 미보유"
    satisfied_by_hint: []
    producer: external_expert
  - id: on_request_docs
    desc: "요청 시 제출 — 라벨 아트워크·사용법·작용기전·원산지 증명·SDS·COA"
    satisfied_by_hint: ["msds_*", "finished_product_test_report", "test_report_*"]
    producer: manufacturer
  - id: label_ph
    desc: "영어 및/또는 필리핀어 라벨"
    satisfied_by_hint: ["draft_from:label_kr", "draft_from:leaflet_*"]
    producer: company
tests_required: [stability, microbiology, heavy_metals]
labeling:
  language: "영어 및/또는 필리핀어(ACD 라벨 요건 — 영어 라벨 허용, 필리핀 개별 규정은 미확인)"
  allergens: null
  other: ["향료 알레르겐 개별 표시 의무 없음 — ACD 부속서 III에 해당 항목 없음", "ACD 라벨 항목 준용(제품명·기능, 사용법, 전성분, 제조국, 현지 책임 회사, 내용량, 배치번호, 제조일·사용기한, 주의사항) (추정)", "CPN 번호 표시 여부 (추정)"]
animal_testing: not_required
timeline:
  lead_time: "처리 23영업일(Citizen's Charter 2025-09)"
  fee: "1년 PHP 500 + LRF 1%(최소 PHP 10), 변형 +PHP 100/년, 1~3년 선택(PHP 500/1,000/1,500). AO 2024-0016 인상안(CPN 연 PHP 1,000)은 2025-06-10부터 유예 — 2026-11 현재 적용 여부 미확인"
  validity: "1~3년 중 선택"
evidence:
  - url: "https://www.fda.gov.ph/wp-content/uploads/2025/09/1.-Issuance-of-Cosmetic-Product-Notification.pdf"
    title: "1. Issuance of Cosmetic Product Notification"
    level: direct
    checked: 2026-11-07
    quote: "Who may avail: Licensed Cosmetic establishments (Distributor, Trader, Manufacturer)"
  - url: "https://www.fda.gov.ph/wp-content/uploads/2025/09/1.-Issuance-of-Cosmetic-Product-Notification.pdf"
    title: "1. Issuance of Cosmetic Product Notification"
    level: direct
    checked: 2026-11-07
    quote: "1-year validity – Php 500 + 1% LRF not less than Php 10.00"
  - url: "https://www.fda.gov.ph/wp-content/uploads/2025/09/1.-Issuance-of-Cosmetic-Product-Notification.pdf"
    title: "1. Issuance of Cosmetic Product Notification"
    level: direct
    checked: 2026-11-07
    quote: "Total Processing Time: 23 working day/s"
  - url: "https://www.fda.gov.ph/fda-advisory-no-2026-1544-pilot-implementation-of-the-automatic-notification-system-for-cosmetic-products-through-the-eportal-1-system/"
    title: "fda advisory no 2026 1544 pilot implementation of the automatic notification system for co"
    level: direct
    checked: 2026-11-07
    quote: "the Declaration and Undertaking (Annex B)"
  - url: "https://rrdportal.fda.gov.ph/docs/AO2024-0016.pdf"
    title: "필리핀 보건부 행정명령 AO 2024-0016 (수수료 개정안, PDF)"
    level: direct
    checked: 2026-11-07
  - url: "https://file.go.gov.sg/annexes-of-the-asean-cosmetic-directive.pdf"
    title: "아세안 화장품 지침 ACD 부속서"
    level: direct
    checked: 2026-11-07
    quote: "Version No.: 2026-1, 22nd June 2026"
  - url: "https://file.go.gov.sg/appendix-ii-asean-cosmetic-labelling-requirements.pdf"
    title: "appendix ii asean cosmetic labelling requirements"
    level: direct
    checked: 2026-11-07
    quote: "shall appear in English and/or National Language and/or a language understood by the consumer"
  - url: "local:조사자료_20261107/해외규격인증_일반583_화장품분류.csv"
    level: secondary
    checked: 2026-11-07
blocking_rules:
  - "ASEAN 금지성분 포함(EU 준용 대조) [kw:ingredient_banned(ASEAN)]"
  - "ASEAN 제한성분 한도 초과 [kw:ingredient_restricted_over(ASEAN)]"
  - "보존제·UV필터·색소가 허용목록 밖 [kw:ingredient_positive_list_missing(ASEAN)]"
conditional_rules:
  - "ASEAN 값은 EU 행 대용 — ACD 부속서 2026-1판과 차이 확인 [kw:ingredient_list_unavailable(ASEAN_ACD)]"
  - "제한성분 함량 미상 [kw:ingredient_restricted_conc_unknown(ASEAN)]"
  - "배합 함량 미보유 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "필리핀 LTO 보유 업체 미지정 [kw:local_entity_missing(PH)]"
  - "PIF 안전성 평가 없음(FDA 감사 대상) [kw:doc_missing(PIF)]"
notes: "원문 확인(2026-11-07, FDA Citizen's Charter 2025-09·Advisory 2026-1544·AO 2024-0016, HSA 게시 ACD 문서): LTO 보유 현지 업체만 신고, 기본 제출 서류 없음(필요 시 라벨·SDS·COA 등 요청), CFS·GMP·공증 불요, 연 PHP 500+1% LRF·1~3년 선택·23영업일, ACD 범위 초과 표방은 CPN 취소, 라벨은 영어 허용(ACD). 아세안은 향료 알레르겐 표시 의무가 없어 allergens를 비움. 2차: LTO 유효기간(AO 2024-0015 스캔 PDF). 미확인: AO 2024-0016 유예 해제·개정 여부(2026), LTO 유효기간 원문, 필리핀 개별 라벨 언어 규정."
