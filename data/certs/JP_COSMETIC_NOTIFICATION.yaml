blocking_rules:
  - "일본 화장품 금지성분(별표1) 포함 [kw:ingredient_banned(JP)]"
  - "배합 한도(별표2) 초과 [kw:ingredient_restricted_over(JP)]"
  - "보존제·UV흡수제·타르색소가 포지티브 리스트 밖 [kw:ingredient_positive_list_missing(JP)]"
conditional_rules:
  - "의약부외품 표방(미백·주름 개선·약용 여드름·살균·염모·육모) — 화장품 届 경로 아님: 표방을 화장품 범위로 고치거나 JP_QUASI_DRUG [kw:claim(whitening|anti_wrinkle|acne|antibacterial|hair_dye|hair_loss)]"
  - "배합 한도 성분 함량 미상 [kw:ingredient_restricted_conc_unknown(JP)]"
  - "배합량 미보유 — 化粧品基準 적합 확인 불가 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "일본 MAH 미확보 [kw:local_entity_missing(JP)]"
  - "위탁제조사 外国製造業者届 미제출 [kw:doc_missing(foreign_manufacturer_notification)]"
  - "일본어 라벨 미작성 [kw:doc_missing(label_jp)]"
  - "INCI 매칭 실패 성분 존재 [kw:ingredient_match_unresolved]"
notes: "원문 확인(◎): 업으로 수입하려면 製造販売業 허가와 품목별 届 필요(R7 Q&A 1), 통관 시 業許可証 사본과 製造販売届書 사본(접수 증명) 제시(Q&A 2·3), 개별 원료 수입은 불필요하나 벌크 등 중간제품은 필요(Q&A 18), 수입신고(輸入届) 제도는 2016년 폐지(H27 Q&A), 약용화장품=의약부외품(Q&A 72), 염모제=지정 의약부외품(Q&A 71), 化粧品基準 별표1~4. 미백·주름 → 의약부외품 판단은 문서 §4-3 ○(일반 지식). 라벨 항목·MAH 갱신·화장품 효능 범위는 (추정)."
