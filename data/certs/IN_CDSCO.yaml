blocking_rules:
  - "2014-11-12 이후 동물실험한 화장품 — 수입 금지(제18조 4항) [kw:animal_test_data_present]"
  - "헥사클로로펜 함유 — 수입 금지(제18조 3항) [kw:ingredient_present(Hexachlorophene)]"
conditional_rules:
  - "인도 성분 규정(IS 4707 Part 2 Annex A 금지 원료, Part 1 색소)은 통합표에 없음 — EU 기준으로 1차 선별만 [kw:ingredient_list_unavailable(IN_BIS)]"
  - "EU 금지성분 포함 — IS 4707 대조 필요 [kw:ingredient_banned(EU)]"
  - "EU 제한성분 한도 초과 또는 함량 미상 [kw:ingredient_restricted_over(EU)]"
  - "배합 함량 미보유 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "인도 대리인·수입자 미지정 [kw:local_entity_missing(IN)]"
  - "스킨크림(IS 6608)·페이스팩(IS 15153) 해당 제품의 BIS 규격 시험 미실시 [kw:doc_missing(bis_standard)]"
  - "비의도적 수은 1ppm 초과(눈 주위 보존제용은 70ppm) [kw:test_result_over(heavy_metals_mercury,1ppm)]"
  - "위임장 치안판사·대사관 인증 또는 아포스티유 미준비 [kw:doc_missing(authorization_legalized)]"
notes: "원문 확인(2026-11-07, 관보 G.S.R. 763(E) Cosmetics Rules 2020 PDF 텍스트 대조): 등록 없이 수입 불가(제12조), 신청인(제조사·대리인·수입자·자회사), 위임장 인증·아포스티유, 6개월 내 결정, 무기한(5년 내 보유 수수료), 수수료(US$1,000/카테고리·US$500/제조소·US$50/변형), 동물실험 화장품 수입 금지(2014-11-12), 헥사클로로펜 수입 금지, 사용기한 6개월 초과, 라벨 RC No.·수입자·보세창고 스티커, BIS 규격(IS 6608 스킨크림·IS 15153 페이스팩), 수은 1ppm, 카테고리 'Skin lightening products'. ingredient_rules EU는 대용값 — 그래서 성분 규칙을 conditional에만 둠(단, 현재 엔진은 EU 금지성분이면 '불가'를 냄 — 반영 보고서 '엔진 변경 필요' 참조). 원문 PDF는 관보 원본의 미러본(thehealthmaster.com) — cdsco.gov.in은 자동 접속 차단. 미확인: 계량법 세부, 하이드로퀴논 명시 조문, 실제 처리기간. 2차: chemlinked 요약."
