notes: "원문 확인(문서 §4-6 ◎): 고시 2024-46호 제30조 — 신청서 + 3회 이상 운영 자체평가표·조직·시설·제조품질관리현황, 3년마다 실태조사, 제조소 단위. 책임판매업자인 회사는 직접 받는 인증이 아니라 위탁제조사 인증을 확인하는 항목이라 kind를 company_certification이 아닌 voluntary_certification으로 두어 제품(제조사)별로 판정되게 함. CGMP 증명서는 제조소 단위라 수출 서류로 쓰려면 제조사 협조가 필요하고, 식약처 등록사항 외국어 증명은 1.4만 원(문서 §4-8 ◎). CGMP 영문 증명 발급 절차·수수료·처리기간은 미확인 (추정)."
