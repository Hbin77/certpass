blocking_rules:
  - "EU 금지성분(부속서 II, CMR 포함) 포함 [kw:ingredient_banned(EU)]"
  - "제한성분(부속서 III) 한도 초과 [kw:ingredient_restricted_over(EU)]"
  - "색소·보존제·UV필터 용도 성분이 부속서 IV·V·VI 허용목록 밖 [kw:ingredient_positive_list_missing(EU)]"
conditional_rules:
  - "제한성분(부속서 III) 함량 미상 [kw:ingredient_restricted_conc_unknown(EU)]"
  - "배합 농도 미보유 — CPNP 농도 입력·CPSR 노출량 계산 불가 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "향료 알레르기 성분 구성 미보유 [kw:doc_missing(allergen_info)]"
  - "EU RP 미지정 [kw:local_entity_missing(EU)]"
  - "서명된 CPSR 없음 [kw:doc_missing(CPSR_signed)]"
  - "안정성·미생물·챌린지 시험 자료 없음 [kw:doc_missing(test_reports)]"
  - "제조사 GMP(ISO 22716·CGMP) 증빙 없음 [kw:manufacturer_cert_missing(ISO 22716|CGMP)]"
  - "INCI·CAS 매칭이 안 된 성분 존재 [kw:ingredient_match_unresolved]"
  - "폄하형 free-from 표방 [kw:claim(paraben_free|free_from_21)]"
  - "나노물질 포함 — 출시 6개월 전 16조 나노 신고 필요 [kw:ingredient_nano]"
notes: "CPNP 신고 성공이 1223/2009 적합을 뜻하지 않음(매뉴얼 1.1 원문). 판정 핵심은 ① 성분(통합표 EU) ② RP 지정 ③ 서명 CPSR·PIF ④ 출시국 언어 라벨. 통합표 EU banned의 D4 행(부속서 II ref 1388)에 INCI 'CYCLOMETHICONE'이 붙어 있어 사이클로메티콘 표기 제품은 D4 금지로 잡힘 — 혼합물 구성(D5·D6) 확인 후 판정(EU_REACH_D4D5D6 참조). 포장은 EU_PPWR, 씻어내는 제품 친환경 라벨은 EU_ECOLABEL_RINSEOFF. 2023/1545 확대 알레르겐 전환일(2026-07-31 신규·2028-07-31 기존)과 free-from·저자극 표방 기준은 (추정)."
