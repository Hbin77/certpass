blocking_rules: []
conditional_rules:
  - "GSO 1943:2024는 유료 표준이라 통합표에 없음 — EU 기준으로 1차 선별만(GSO 1943은 EU 부속서 준용, 2차) [kw:ingredient_list_unavailable(GSO1943)]"
  - "EU 금지성분 포함 — GSO 1943 대조 필요 [kw:ingredient_banned(EU)]"
  - "EU 제한성분 한도 초과 [kw:ingredient_restricted_over(EU)]"
  - "돼지 유래 성분 — ECAS 이슬람 금지 성분(2차) [kw:ingredient_present(*Porcine*|*Lard*|*Sus Scrofa*)]"
  - "UAE 면허 업체·유통 계약 미확보 [kw:local_entity_missing(AE)]"
  - "GSO 1943 인정 시험소 성적서 없음 [kw:doc_missing(test_reports_accredited)]"
  - "부속서 3 제품 안전성 보고서 없음 [kw:doc_missing(safety_report)]"
  - "2025-08 WTO 통보된 새 Cabinet Decision 초안(GSO 1943·2528·2636 PIF·ISO 22716 인용) 채택 여부 확인 [kw:manual_check(AE_new_decision)]"
notes: "원문 확인(2026-11-07, Bureau Veritas 게시 MoIAT ECAS 화장품 서비스카드 2023-02-09, MoIAT 할랄 페이지): 신청 요건 — RFC, UAE 면허, GSO 1943 인정 시험소 성적서, 제조사 성분·함량 선언, 제조사 레터헤드 CFS, 유통 계약, GMP, 라벨, Resolution 18/2014 부속서 3 안전성 보고서, 전자 적합성 선언; 1.5영업일, 6개월 미완료 시 취소, 증서당 1브랜드·1원산지·1카테고리 최대 25 SKU. 할랄 국가 마크는 선택. GSO 1943은 걸프 표준·유료(사우디 원문 ◎). 2차: GSO 1943=EU 부속서 준용, EU식 알레르겐 표기, 아랍어+영어 라벨, 돼지 유래 금지, 1년 갱신, Montaji 5년·약 AED 200. 미확인: 공식 수수료표, Montaji 공식 가이드·스티커, 새 Cabinet Decision 채택, GSO 1943:2024 원문(알레르겐·알부틴·알코올 조항)."
