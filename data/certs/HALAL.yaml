blocking_rules:
  - "돼지 유래 성분 확인 [kw:ingredient_present(*Porcine*|*Lard*|*Sus Scrofa*|*Pig *)]"
conditional_rules:
  - "동물 유래 가능 성분(글리세린·지방산 에스터·스테아르산·스쿠알렌 등) 기원 미확인 — 공급사 할랄 인증서 또는 기원 진술서 [kw:ingredient_origin_unknown(animal)]"
  - "에탄올 사용 — 주류(khamr) 산업 유래면 불가, 그 밖의 에탄올은 함량 제한 없음(MUI 파트와 11/2018) [kw:ingredient_present(Alcohol|Alcohol Denat.|Ethanol)]"
  - "발효·효소 원료 — 배지에 돼지 유래 물질 사용 여부 확인(Kepka 20/2023) [kw:ingredient_present(*Ferment*|*Lysate*)]"
  - "원료 할랄 증빙 없음 [kw:doc_missing(ingredient_halal_docs)]"
  - "제조소 할랄 보증 체계·현장 심사 미실시 [kw:doc_missing(HAS_manual)]"
  - "인도네시아 출시 — 2028-10-17 이후 인증서 미보유·미등록 [kw:target_market(ID)] [kw:date_on_or_after(2028-10-17)] [kw:doc_missing(BPJPH_registration)]"
notes: "원문 확인(2026-11-07): BPJPH 공지 — PP 40/2026으로 화장품 할랄 의무 2026-10-17 → 2028-10-17 연장(화장품은 기업 규모 제한 없음). JAKIM 공인 해외기관 목록(2026-08-21 시행판) 72번 KMF·73번 KHA, 인정 3년 — 수입품 할랄 표시는 공인 기관 인증+기관명. Kepka 370/2026(화장품 SJPH 지침, 2026-10-18 시행): 원료 범위에 포장재·어플리케이터·세척 검증 매체 포함, 인체 유래(태반·혈액·모발·소변) 금지, 해외 기업 할랄 감독자 역량시험, 6개월 보고. Kepka 20/2023: 돼지·혈액·khamr 등 금지, 수생동물 전부 할랄(흑진주는 유리). MUI 파트와 11/2018(khamr 아닌 에탄올은 함량 제한 없음)·26/2013·60/2020. BPJPH 해외 인증서 등록: 수입자·공식 대리인이 SIHALAL 신청, 인증서 영사확인(아포스티유 가능 — 요지만 확인). UAE 할랄 국가 마크는 선택, GCC 화장품 할랄 표준은 GSO 2055-4:2021(유료, 본문 미열람). 앞선 카드의 '2026-10-17 의무(PP 42/2024)'를 고쳤다. 판정: 금지 원료가 없으면 '조건부'(원료 기원 증빙 + 제조소 할랄 관리). 2차: 비할랄 표시(BPJPH 3/2026 법령 미러), 수수료, 유효기간, JAKIM 직접 신청 절차(ChemLinked MPPHM 2020). 미확인: KMF·KHA 절차·서류·비용·기간·유효기간(사이트 접속 불가), KMF-BS2016 원문, MS 2634 원문·에탄올 조항, Kepka 90/2023 원문, LPPOM 수수료, GSO 2055-4 본문, JAKIM 목록의 품목 범위."
