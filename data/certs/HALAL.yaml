# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: HALAL
name_ko: 할랄 인증(화장품, 국제)
name_en: Halal Certification for Cosmetics (KMF·KHA·JAKIM·BPJPH routes)
jurisdiction: GLOBAL
kind: voluntary_certification
strategic_kr: true
general_kr_no: null
support_rate: "50~70%, 최대 1억(중기부 전략인증 — 국제 HALAL, 식품·화장품 등)"
applies_to:
  product_types: [cosmetic]
  condition: "모든 화장품에 신청 가능(자발 인증). 인도네시아 화장품 할랄 의무는 PP 40/2026(2026-10-14)으로 2028-10-17까지 유예 — 그 뒤 미인증 제품은 인증 또는 비할랄 표시 필요(ID_BPOM 참조). 말레이시아·UAE는 할랄을 표방할 때만"
ingredient_rules: none
claim_rules:
  - claim: halal
    effect: ok
    note: "인증 후 인증기관 로고·번호 표시. 말레이시아는 수입품을 할랄로 표시하려면 JAKIM 공인 해외기관 인증 + 그 기관명 표기(거래표시명령 2011), 인도네시아 할랄 로고는 BPJPH 인증(또는 해외 인증서 등록) 후만. 미인증 할랄 표방 불가"
local_entity:
  required: false
  role: "인도네시아 유통 시 해외 할랄 인증서를 BPJPH(SIHALAL)에 등록할 수입자 또는 인도네시아 공식 대리인"
documents_required:
  - id: application
    desc: "인증 신청서, 사업자등록증, 제조업 등록·위탁제조 계약서 — KMF·KHA 신청 서류 세부는 미확인(사이트 접속 불가)"
    satisfied_by_hint: ["company.role_kr:화장품책임판매업자", "manufacturer_registration"]
    producer: company
  - id: product_formula
    desc: "제품별 전성분·원료 목록(원료 제조사·공급사 포함)"
    satisfied_by_hint: ["formula_*", "ingredient_list_*"]
    producer: manufacturer
  - id: ingredient_halal_docs
    desc: "원료별 할랄 인증서 또는 등록번호 — 없으면 공정 흐름도·조성·CoA와 돼지·개 무관(bebas najis berat)·동물 무관 진술서, MSDS·시험성적서(Kepka 370/2026). 클렌징밤은 글리세린·지방산 에스터 등 7종 기원 증빙 필요"
    satisfied_by_hint: []
    producer: manufacturer
  - id: process_flow
    desc: "제조 공정도, 공용 설비 목록·세척 검증 기록 — 돼지·개 오염 설비는 완전 분리, 비할랄 성분이 없는 비인증 제품과의 설비 공용은 세척 검증 문서로 허용"
    satisfied_by_hint: []
    producer: manufacturer
  - id: HAS_manual
    desc: "할랄 보증 체계(SJPH) 매뉴얼·할랄 정책, 할랄 감독자(Penyelia Halal) 임명·교육 — 해외 기업은 감독자 역량시험 필수, 내부감사·경영검토 연 1회, 조성·공정 변경은 6개월마다 BPJPH 보고"
    satisfied_by_hint: []
    producer: manufacturer
  - id: packaging_docs
    desc: "포장재·어플리케이터·세척제 할랄 증빙(Kepka 370 원료 범위에 포함)"
    satisfied_by_hint: []
    producer: manufacturer
  - id: site_audit
    desc: "인증기관 제조소 현장 심사"
    satisfied_by_hint: []
    producer: authority
  - id: BPJPH_registration
    desc: "인도네시아 유통 시 해외 할랄 인증서 BPJPH 등록(SIHALAL) — 수입자·공식 대리인이 신청, 해외기업 위임계약서·수입자 NIB·인증서 사본(인니 공관 영사확인 또는 아포스티유)·HS코드 품목표·진술서"
    satisfied_by_hint: []
    producer: authority
tests_required: []
labeling:
  language: null
  allergens: null
  other: ["인증기관 할랄 로고·인증번호", "인도네시아: 할랄 로고는 BPJPH 인증 후, 비할랄 원료 제품은 'NON HALAL' 또는 'MENGANDUNG BABI'+돼지 그림 표시로 판매 가능(Peraturan BPJPH 3/2026, 2026-07-23 시행, 2차)", "말레이시아: 수입품 할랄 표시 때 JAKIM 공인 해외 인증기관 이름 표기", "물이 스며들지 않는 제품(불투수)은 '불투수' 표시와 기도 전 제거 안내가 있으면 인증 가능(MUI 파트와 60/2020) — 씻어내는 제품은 해당 없음"]
animal_testing: not_required
timeline:
  lead_time: "BPJPH 인증 3~9개월(2차), JAKIM 직접 신청 약 6개월(2차) — KMF·KHA 기간 미확인"
  fee: "BPJPH 해외 인증서 등록 건당 Rp800,000, 외국기업 직접 신청 건당 Rp12,500,000(PMK 57/2021, 2022 보도, 2차), JAKIM 연 RM100~1,000(규모별, 2차) — KMF·KHA 수수료 미확인"
  validity: "BPJPH 인증은 조성·공정이 그대로면 무기한(2차), JAKIM 약 3년(2차) — KMF·KHA 유효기간 미확인. JAKIM의 해외 기관 인정 유효 3년"
