# 인증 요건 카드 — 판정 순서·태그 문법은 README.md 참고
id: TW_TFDA
name_ko: 대만 화장품 제품 등록(登錄)·PIF
name_en: Taiwan TFDA Cosmetic Product Notification (產品登錄) and Product Information File
jurisdiction: TW
kind: mandatory_registration
strategic_kr: false
general_kr_no: 273
support_rate: "50~70%, 최대 1억(중기부 일반지원 583종 273번 대만FDA)"
applies_to:
  product_types: [cosmetic]
  condition: "대만 출시 화장품 전부. PIF는 2026-07부터 전 품목 의무 [kw:target_market(TW)]"
ingredient_rules: TW
claim_rules:
  - claim: whitening
    effect: ok
    note: "화장품 미백 표방 가능. 미백 성분 사용 한도·특정용도 해당 여부는 대만 사용제한표 확인 (추정)"
  - claim: sunscreen
    effect: ok
    note: "특정용도화장품 — 제품 등록 2024-07, PIF 2024-07부터 의무(문서 ◎). 성분·함량 표시 (추정)"
  - claim: hair_dye
    effect: ok
    note: "특정용도화장품(염모) — 자외선차단과 같은 일정 (추정)"
  - claim: acne
    effect: drug_risk
    note: "여드름 치료 표현은 의약품 (추정)"
  - claim: hair_loss
    effect: drug_risk
    note: "탈모 치료 표현은 의약품 (추정)"
  - claim: medical
    effect: not_allowed
    note: "의료 효능 표방 금지 (추정)"
local_entity:
  required: true
  role: "대만 수입업자(화장품 업체)가 제품 등록·PIF 보관 (추정)"
documents_required:
  - id: product_registration
    desc: "TFDA 화장품 제품 登錄(출시 전, cos.fda.gov.tw 플랫폼)"
    satisfied_by_hint: []
    producer: company
  - id: PIF
    desc: "제품정보파일 — 기본정보, 전성분·함량, 라벨, 제조방법, GMP 증명, 원료 규격, 이화학·미생물, 독성 자료, 안정성, 안전성 평가 (구성 항목은 추정)"
    satisfied_by_hint: []
    producer: company
  - id: safety_assessment_signed
    desc: "자격 있는 안전성 평가자 서명 안전 자료 (추정)"
    satisfied_by_hint: ["draft_from:formula_*", "draft_from:msds_*"]
    producer: external_expert
  - id: GMP_proof
    desc: "제조사 GMP 증명(ISO 22716 또는 정부 GMP) (추정)"
    satisfied_by_hint: ["manufacturer.certs:ISO 22716", "manufacturer.certs:CGMP"]
    producer: manufacturer
  - id: formula_pct
    desc: "전성분·함량(사용제한 성분 대조용)"
    satisfied_by_hint: ["formula_known:full_with_concentration", "formula_composition_with_percent"]
    producer: manufacturer
  - id: test_reports
    desc: "미생물·이화학·안정성 시험"
    satisfied_by_hint: ["stability_test*", "challenge_test*", "draft_from:finished_product_test_report", "draft_from:bulk_test_report", "draft_from:test_report_*"]
    producer: lab
  - id: label_tw
    desc: "번체 중국어 라벨"
    satisfied_by_hint: ["draft_from:label_kr", "draft_from:brochure_*"]
    producer: company
tests_required: [stability, microbiology, challenge_test, heavy_metals, physicochemical]
labeling:
  language: "번체 중국어 (추정)"
  allergens: null
  other: ["알레르겐 — 향료 알레르겐 개별 표시 기준 확인 필요 (추정)", "품명", "용도", "용법·보존방법", "순중량 또는 용량", "전성분(특정용도 성분은 함량)", "주의사항", "제조·수입업자 이름·주소·전화", "원산지", "제조일·유효기간 또는 유효일자", "로트번호 (항목 전체 추정)"]
animal_testing: banned
timeline:
  lead_time: "온라인 등록은 즉시, PIF 준비 별도 (추정)"
  fee: "확인 필요 (추정)"
  validity: "정기 갱신(연 1회로 추정) (추정)"
evidence:
  - url: "https://www.fda.gov.tw"
    title: "기관 누리집"
    level: direct
    checked: 2026-11-07
  - url: "https://cos.fda.gov.tw"
    title: "化粧品產品登錄平台系統"
    level: direct
    checked: 2026-11-07
  - url: "local:조사자료_20261107/대만TFDA_규제목록/meta_173682.json"
    level: direct
    checked: 2026-11-07
  - url: "local:트랙B_데이터모델_조사정리_20261107.md#4-3"
    level: direct
    checked: 2026-11-07
blocking_rules:
  - "대만 금지성분 포함 [kw:ingredient_banned(TW)]"
  - "대만 사용제한 한도 초과 [kw:ingredient_restricted_over(TW)]"
  - "보존제·UV필터·색소가 대만 허용표 밖(보존제는 EU·미국·일본 허용분 예외 있음) [kw:ingredient_positive_list_missing(TW)]"
conditional_rules:
  - "사용제한 성분 함량 미상 [kw:ingredient_restricted_conc_unknown(TW)]"
  - "배합 함량 미보유 [kw:formula_known(ingredients_only_no_concentration|concept_only)]"
  - "대만 수입업자 미지정 [kw:local_entity_missing(TW)]"
  - "PIF 미작성(2026-07부터 전 품목 의무) [kw:date_on_or_after(2026-07-01)] [kw:doc_missing(PIF)]"
  - "서명된 안전성 평가 없음 [kw:doc_missing(safety_assessment_signed)]"
  - "제조사 GMP 증빙 없음 [kw:manufacturer_cert_missing(ISO 22716|CGMP)]"
  - "INCI·CAS 매칭 실패 성분 존재 [kw:ingredient_match_unresolved]"
notes: "원문 확인(문서 §4-3 ◎): PIF 의무 2024-07 특정용도 → 2025-07 영유아·입술·눈 → 2026-07 전 품목, 제품 등록 일반 2021-07·특정용도 2024-07, 대만 규제목록 5종(금지 659·제한 186·보존제 57·UV 27·색소 152건, 상업 재배포 가능). 보존제표 원문 비고: 표에 없는 보존제라도 EU·미국·일본이 허용·한도를 정했으면 가장 엄격한 한도로 허용 → positive_list_missing(TW) 판정 전에 EU·JP 보존제 허용 여부 보조 확인. 현지 업체 요건·PIF 구성·라벨 항목·동물실험 금지 시행·수수료·갱신은 (추정)."
